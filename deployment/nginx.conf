# ✅ Phase 2: Configuration Nginx pour load balancing

upstream backend_servers {
    # ✅ Round-robin avec poids pour distribution équitable
    least_conn;  # Utilise least connections au lieu de round-robin
    
    # ✅ Instances backend (à configurer selon déploiement)
    server backend1:3000 weight=1 max_fails=3 fail_timeout=30s;
    server backend2:3000 weight=1 max_fails=3 fail_timeout=30s;
    server backend3:3000 weight=1 max_fails=3 fail_timeout=30s;
    
    # ✅ Health check
    keepalive 32;
}

# ✅ Cache pour assets statiques
proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=static_cache:10m max_size=1g inactive=60m use_temp_path=off;

server {
    listen 80;
    server_name api.yukpomnang.com;

    # ✅ Timeouts pour longues requêtes (génération vidéo)
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    send_timeout 300s;

    # ✅ Buffer sizes pour grandes requêtes
    client_max_body_size 200M;
    client_body_buffer_size 128k;
    proxy_buffering on;
    proxy_buffer_size 4k;
    proxy_buffers 8 4k;
    proxy_busy_buffers_size 8k;

    # ✅ Headers pour monitoring
    add_header X-Upstream $upstream_addr;
    add_header X-Request-ID $request_id;

    # ✅ Health check endpoint
    location /health {
        access_log off;
        proxy_pass http://backend_servers/api/health;
        proxy_set_header Host $host;
    }

    # ✅ API endpoints
    location /api/ {
        proxy_pass http://backend_servers;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # ✅ Rate limiting par IP
        limit_req zone=api_limit burst=20 nodelay;
        
        # ✅ CORS headers
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
        add_header Access-Control-Allow-Headers "Authorization, Content-Type";
    }

    # ✅ Cache pour assets statiques
    location /static/ {
        proxy_pass http://backend_servers;
        proxy_cache static_cache;
        proxy_cache_valid 200 60m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header X-Cache-Status $upstream_cache_status;
    }

    # ✅ WebSocket support pour real-time updates
    location /ws/ {
        proxy_pass http://backend_servers;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }
}

# ✅ Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
limit_req_zone $binary_remote_addr zone=video_limit:10m rate=10r/s;

