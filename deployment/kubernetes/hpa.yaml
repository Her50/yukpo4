# ✅ Phase 2: Horizontal Pod Autoscaler pour auto-scaling

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: yukpomnang-backend-hpa
  namespace: yukpomnang
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: yukpomnang-backend
  minReplicas: 2
  maxReplicas: 100  # ✅ Support jusqu'à 100 instances
  metrics:
    # ✅ Scaling basé sur CPU
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    # ✅ Scaling basé sur Memory
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
    # ✅ Scaling basé sur queue length (custom metric)
    - type: Object
      object:
        metric:
          name: video_queue_length
        describedObject:
          apiVersion: v1
          kind: Service
          name: yukpomnang-backend
        target:
          type: Value
          value: "1000"  # Scale up si queue > 1000 jobs
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300  # Attendre 5min avant scale down
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0  # Scale up immédiatement
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      - type: Pods
        value: 10
        periodSeconds: 30
      selectPolicy: Max

