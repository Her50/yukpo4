version: '3.8'

services:
  backend:
    image: ghcr.io/Her50/yukpo4/yukpomnang-backend-optimized:latest
    container_name: yukpo-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - ENVIRONMENT=production
      - RUST_LOG=info
      - HOST=0.0.0.0
      - PORT=8080
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      - postgres
      - redis
    networks:
      - yukpo-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  postgres:
    image: pgvector/pgvector:pg15
    container_name: yukpo-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=yukpomnang
      - POSTGRES_USER=yukpo_user
      - POSTGRES_PASSWORD=${DB_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - yukpo-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yukpo_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: yukpo-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-changeme}
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - yukpo-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:

networks:
  yukpo-network:
    driver: bridge

