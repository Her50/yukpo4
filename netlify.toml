[build]
  publish = "frontend/dist"
  command = "cd frontend && npm install && npm run build"

[build.environment]
  VITE_API_BASE_URL = ""  # Utilise le proxy Netlify (redirects dans netlify.toml)
  VITE_APP_ENV = "production"
  VITE_APP_DEBUG = "false"

[[redirects]]
  from = "/api/*"
  to = "https://api.yukpomnang.com/api/:splat"
  status = 200
  force = true
  headers = {Access-Control-Allow-Origin = "*"}

[[redirects]]
  from = "/auth/*"
  to = "https://api.yukpomnang.com/auth/:splat"
  status = 200
  force = true
  headers = {Access-Control-Allow-Origin = "*"}

[[redirects]]
  from = "/services/*"
  to = "https://api.yukpomnang.com/services/:splat"
  status = 200
  force = true
  headers = {Access-Control-Allow-Origin = "*"}

