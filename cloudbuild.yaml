steps:
  # Pull image précédente pour cache (si elle existe)
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        docker pull europe-west1-docker.pkg.dev/$PROJECT_ID/yukpo-backend/yukpo-backend:latest || true

  # Build avec cache from previous image (réutilise les layers Rust compilés)
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--cache-from=europe-west1-docker.pkg.dev/$PROJECT_ID/yukpo-backend/yukpo-backend:latest'
      - '-f'
      - 'backend/Dockerfile.cloud.optimized'
      - '-t'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/yukpo-backend/yukpo-backend:latest'
      - 'backend'
    timeout: '2400s'

  # Push to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'europe-west1-docker.pkg.dev/$PROJECT_ID/yukpo-backend/yukpo-backend:latest']

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'yukpo-backend'
      - '--image=europe-west1-docker.pkg.dev/$PROJECT_ID/yukpo-backend/yukpo-backend:latest'
      - '--region=europe-west1'
      - '--platform=managed'
      - '--quiet'

images:
  - 'europe-west1-docker.pkg.dev/$PROJECT_ID/yukpo-backend/yukpo-backend:latest'

timeout: '3000s'

options:
  machineType: 'E2_HIGHCPU_32'
  logging: CLOUD_LOGGING_ONLY
  env:
    - 'DOCKER_BUILDKIT=1'
