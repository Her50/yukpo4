steps:
  # Build depuis la racine du repo (Dockerfile.build utilise COPY backend/... comme contexte)
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-f'
      - 'Dockerfile.build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/yukpo-backend:latest'
      - '.'
    timeout: '1800s'

  # Push to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/yukpo-backend:latest']

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'yukpo-backend'
      - '--image=gcr.io/$PROJECT_ID/yukpo-backend:latest'
      - '--region=europe-west1'
      - '--platform=managed'
      - '--quiet'

images:
  - 'gcr.io/$PROJECT_ID/yukpo-backend:latest'

timeout: '2400s'

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY
