services:
  - type: web
    name: yukpomnang-backend
    env: rust
    buildCommand: chmod +x backend/build.sh && ./backend/build.sh
    startCommand: cd backend && ./target/release/yukpomnang_backend
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: RUST_LOG
        value: info
      - key: LOG_FORMAT
        value: json
      - key: SQLX_OFFLINE
        value: true
      - key: LANG
        value: fr_FR.UTF-8
      - key: LC_ALL
        value: fr_FR.UTF-8
      - key: GOOGLE_MAPS_API_KEY
        sync: false  # À configurer manuellement dans Render Dashboard
    healthCheckPath: /healthz
    autoDeploy: true
    branch: master
    rootDir: /
