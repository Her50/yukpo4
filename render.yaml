services:
  - type: web
    name: yukpomnang-backend
    env: rust
    buildCommand: chmod +x backend/build.sh && ./backend/build.sh
    startCommand: cd backend && ./target/release/yukpomnang_backend
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: RUST_LOG
        value: info
      - key: LOG_FORMAT
        value: json
    healthCheckPath: /healthz
    autoDeploy: true
    branch: master
    rootDir: /
