# Configuration Fly.io pour le backend Yukpo (apps bourse, pharmacie, restaurant).
# Déploiement temporaire — remplace GCP Cloud Run pendant la coupure facturation.
# Redéploiement 2026-05-12 (frontend + patches sécurité).
#
# Caractéristiques :
#   - Auto-scale horizontal via concurrence (req/s)
#   - VM 1GB pour démarrer (free tier compatible si org dédiée)
#   - Modules GPU/Broll/Stream désactivés par env var (non utilisés par les 3 apps)
#   - Health check sur /health
#   - Région CDG (Paris) — même que yukpo_assurance, latence minimale

app = "yukpo-fly-backend"
primary_region = "cdg"

[build]
  # Dockerfile dédié Fly : compile sans la feature `gpu` (lourde et inutile pour bourse/pharma/resto).
  # Évite les OOM lors du build remote Fly (limité à 4-6 GB RAM par défaut).
  dockerfile = "Dockerfile.fly"

[env]
  # Ports + log
  PORT = "8080"
  HOST = "0.0.0.0"
  RUST_LOG = "info"
  APP_ENV = "production"
  CLOUD_RUN = "false"        # ✅ flag : on n'est plus sur Cloud Run, désactive les hacks GCP-spécifiques

  # ✅ Modules **désactivés** sur Fly (non utilisés par bourse/pharma/resto) :
  GPU_ENABLED = "false"
  ENABLE_AI_OPTIMIZATIONS = "true"

  # Pool DB — calibré pour scale dynamique 1→25 VM sur Fly Postgres.
  # Avec 25 VM × 60 = 1500 connexions max. Si Fly PG single-node sature à ~95,
  # mettre Cloudflare Hyperdrive devant (cf scripts/setup-hyperdrive.sh) :
  # Hyperdrive multiplexe les conn backend → DB et tient des milliers de
  # clients sur une centaine de conn DB réelles.
  DB_POOL_SIZE = "60"
  DB_POOL_MIN_SIZE = "5"
  DB_ACQUIRE_TIMEOUT_SECS = "8"
  # ✅ Statement timeout par-requête (évite qu'une requête bloque tout le pool)
  DB_STATEMENT_TIMEOUT_MS = "30000"
  DB_LOCK_TIMEOUT_MS = "8000"
  DB_IDLE_IN_TX_TIMEOUT_MS = "15000"

  # Sécurité / billing Yukpo
  YUKPO_IA_TOKEN_MULTIPLIER = "20"
  YUKPO_SIGNUP_BONUS_TOKENS = "4000"
  YUKPO_IA_EXEMPT_ALL_PARTNERS = "true"   # phase de lancement : tous partenaires gratuits

  # Patch H3 (2026-05-12) — Liste CSV des user_id des admins de la librairie
  # Yukpo officielle. Ils ont les mêmes droits qu'un super_admin sur les
  # endpoints admin Bourse (marketplace-overview, recover_consignation, etc.).
  # Les libraires externes (partenaires) ne sont PAS dans cette liste.
  # Exemple : "1,42,108". Vide ou absent = aucun admin librairie officielle.
  YUKPO_OFFICIAL_LIBRAIRIE_USER_IDS = ""

  # Migrations auto au démarrage (sqlx::migrate!)
  # ⚠️ Désactivé 2026-05-15 : seed MINESEC Technique cassé (etablissement_id NOT NULL).
  # Le router complet ne chargeait pas (return Err sur erreur critique → bloque
  # tout le démarrage Axum). À réactiver après fix du seed dans auto_migrate.rs.
  ENABLE_AUTO_MIGRATIONS = "false"

[http_service]
  internal_port = 8080
  force_https = true
  # ✅ Patch 2026-05-16 — Autoscaling dynamique calibré campagne 10k users :
  #   - 1 seule VM en idle (≈$10-15/mois) — économie maximum hors campagne
  #   - auto_stop_machines = "stop" → kill des VM idle après idle_timeout
  #   - auto_start_machines = true → spawn nouvelles VM quand soft_limit atteint
  #   - VM 2 GB pour cold-start réduit (~15-25 s vs 60 s en 1 GB) et headroom
  #     mémoire pour Rust/sqlx + cache
  # Capacité finale : 25 VM × 500 hard = 12 500 conn HTTP simultanées
  # Coût pic campagne (~2 h × 25 VM 2 GB) ≈ $5-10 ; idle reste à $10-15/mois
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  # Plafond explicite : 25 = défaut Fly (extensible sur demande à 100+)
  max_machines_running = 25

  # ✅ Concurrence orientée connexions — soft déclenche scale-up bien avant
  # saturation hard. Marge de 50 % pour permettre le boot d'une nouvelle VM
  # avant qu'on refuse des connexions (proxy 503).
  # 25 × 250 soft = 6 250 conn → début du scale ; 25 × 500 hard = 12 500 max
  [http_service.concurrency]
    type = "connections"
    soft_limit = 250
    hard_limit = 500

  [http_service.http_options]
    response_timeout = 120         # 2 min — marge pour appels LLM lourds
    # Idle timeout court → libère vite les conn pour que l'autoscaler
    # puisse redescendre rapidement et tuer les VM excédentaires.
    idle_timeout = 30

[[vm]]
  # ✅ 2026-05-16 — Passage à 2 GB :
  #   - Cold-start réduit (la JVM-like init de sqlx + tokio + ort_sys tient mieux)
  #   - Headroom mémoire pour cache Redis local + multiplexage connexions DB
  #   - Coût marginal : ~$10/mois supplémentaire par VM idle (vs 1 GB)
  memory = "2gb"
  cpu_kind = "shared"
  cpus = 1

# Health check Fly (différent du HEALTHCHECK Docker, plus rapide)
# ✅ 2026-05-16 — grace_period réduit : avec 2 GB et binaire stripped,
# le boot Rust + pool warm-up tient en ~25-30 s. 45 s = marge confort.
[checks]
  [checks.health]
    grace_period = "45s"
    interval = "10s"               # check + fréquent → détection panne plus rapide
    method = "get"
    path = "/health"
    port = 8080
    timeout = "5s"                 # /health doit être ultra-rapide (sans hit DB)
    type = "http"

# ✅ Patch 2026-05-12 — Shutdown gracieux lors du scale-down auto :
# Fly envoie SIGINT (au lieu de SIGTERM), laisse 30s aux requêtes en cours
# de se terminer, puis kill. Évite de couper brutalement un appel LLM en cours.
# Note : nécessite que le binaire écoute SIGINT (axum::serve().with_graceful_shutdown).
kill_signal = "SIGINT"
kill_timeout = 30
