# Configuration Fly.io pour le backend Yukpo (apps bourse, pharmacie, restaurant).
# Déploiement temporaire — remplace GCP Cloud Run pendant la coupure facturation.
# Redéploiement 2026-05-12 (frontend + patches sécurité).
#
# Caractéristiques :
#   - Auto-scale horizontal via concurrence (req/s)
#   - VM 1GB pour démarrer (free tier compatible si org dédiée)
#   - Modules GPU/Broll/Stream désactivés par env var (non utilisés par les 3 apps)
#   - Health check sur /health
#   - Région CDG (Paris) — même que yukpo_assurance, latence minimale

app = "yukpo-fly-backend"
primary_region = "cdg"

[build]
  # Dockerfile dédié Fly : compile sans la feature `gpu` (lourde et inutile pour bourse/pharma/resto).
  # Évite les OOM lors du build remote Fly (limité à 4-6 GB RAM par défaut).
  dockerfile = "Dockerfile.fly"

[env]
  # Ports + log
  PORT = "8080"
  HOST = "0.0.0.0"
  RUST_LOG = "info"
  APP_ENV = "production"
  CLOUD_RUN = "false"        # ✅ flag : on n'est plus sur Cloud Run, désactive les hacks GCP-spécifiques

  # ✅ Modules **désactivés** sur Fly (non utilisés par bourse/pharma/resto) :
  GPU_ENABLED = "false"
  ENABLE_AI_OPTIMIZATIONS = "true"

  # ✅ 2026-05-16 — Pool DB recalibré objectif 10 000 transactions simultanées.
  #
  # Avant : 60 conn × 25 VM = 1500 conn max → satureait Fly PG (~95 conn lib)
  # AVANT même que l'autoscaler stabilise. Pool dimensionné pour le pire cas
  # alors que la médiane utilisait ~5 conn par VM.
  #
  # Maintenant : 20 conn × 50 VM = 1000 conn max théorique. Avec
  # Cloudflare Hyperdrive (cf. scripts/setup-hyperdrive.sh), seules ~80 conn
  # backend → DB sont effectivement maintenues côté Postgres. Hyperdrive
  # multiplexe le reste. **Activer Hyperdrive avant pic campagne.**
  #
  # Si Hyperdrive indisponible : utiliser PgBouncer côté Fly Postgres ou
  # baisser DB_POOL_SIZE à 12 (12×50 = 600, à la limite haute).
  DB_POOL_SIZE = "20"
  DB_POOL_MIN_SIZE = "5"
  DB_ACQUIRE_TIMEOUT_SECS = "8"
  # ✅ 2026-05-16 — Statement timeout réduit 30s → 8s : une requête qui prend
  # >8 s a un problème (index manquant, lock contention) et bloque le pool.
  # Mieux vaut la couper et logger qu'attendre passivement. Les endpoints
  # qui doivent vraiment > 8 s (export, OCR LLM long) doivent override
  # localement via `SET LOCAL statement_timeout = '60s'` dans leur transaction.
  DB_STATEMENT_TIMEOUT_MS = "8000"
  DB_LOCK_TIMEOUT_MS = "5000"
  DB_IDLE_IN_TX_TIMEOUT_MS = "10000"

  # ✅ 2026-05-16 — Read replica pour scale-out lecture (catalogues, recherches).
  # Si défini, les SELECTs analytics/search sont routés ici, libérant le primary
  # pour les writes (wallet, commandes). Sinon (vide), tout passe sur primary.
  # DATABASE_URL_RO = "postgres://reader@..."
  DATABASE_URL_RO = ""

  # Sécurité / billing Yukpo
  YUKPO_IA_TOKEN_MULTIPLIER = "20"
  YUKPO_SIGNUP_BONUS_TOKENS = "4000"
  YUKPO_IA_EXEMPT_ALL_PARTNERS = "true"   # phase de lancement : tous partenaires gratuits

  # Patch H3 (2026-05-12) — Liste CSV des user_id des admins de la librairie
  # Yukpo officielle. Ils ont les mêmes droits qu'un super_admin sur les
  # endpoints admin Bourse (marketplace-overview, recover_consignation, etc.).
  # Les libraires externes (partenaires) ne sont PAS dans cette liste.
  # Exemple : "1,42,108". Vide ou absent = aucun admin librairie officielle.
  YUKPO_OFFICIAL_LIBRAIRIE_USER_IDS = ""

  # Migrations auto au démarrage (sqlx::migrate!)
  # ⚠️ Désactivé 2026-05-15 : seed MINESEC Technique cassé (etablissement_id NOT NULL).
  # Le router complet ne chargeait pas (return Err sur erreur critique → bloque
  # tout le démarrage Axum). À réactiver après fix du seed dans auto_migrate.rs.
  ENABLE_AUTO_MIGRATIONS = "false"

[http_service]
  internal_port = 8080
  force_https = true
  # ✅ Patch 2026-05-16 v2 — Autoscaling dynamique calibré 10 000 tx simultanées.
  #
  # Capacité cible : 10 000 transactions HTTP concurrentes en pic campagne.
  # Profil : 50 VM × 300 soft_limit = 15 000 conn (marge 50 %).
  #
  #   - min_machines_running = 3 → toujours 3 VM warm pour absorber un burst
  #     sans cold-start (cold-start Rust ≈ 25-30 s sur 2 GB)
  #   - max_machines_running = 50 → cap explicite. Au-delà, contacter Fly
  #     (defaults > 25 nécessitent autorisation, fait via support 2026-04)
  #   - auto_stop_machines = "stop" → kill VM idle après idle_timeout, économise
  #     en heures creuses
  #   - VM 2 GB → suffisant si DB_POOL_SIZE=20 (≈ 30 MB) + Tokio + cache local.
  #     Si on monte à 8 GB ce serait du gaspillage pour ce profil de charge.
  #
  # Coût pic 10K tx (~2 h × 50 VM 2 GB shared) ≈ $20-30 ; idle 3 VM ≈ $30-45/mois.
  auto_stop_machines = "stop"
  auto_start_machines = true
  # ✅ 2026-05-17 — Bumped 3 → 5 après load test du 17/05 qui révèle qu'à 100 VU
  # depuis 1 IP, l'app dégrade fort (p99 10s). 5 VM warm absorbent mieux le burst
  # initial sans cold-start cascade.
  min_machines_running = 5
  # ✅ 2026-05-16 — Plafond 25 (au lieu de 50) avant campagne.
  # Calcul : 25 VM × 200 hard = 5 000 conn HTTP max (post-tuning 2026-05-17).
  # Worst-case facture = 25 × $3.89 ≈ $97/mois (impossible avec auto_stop).
  # Si la campagne sature ce plafond, monter dynamiquement :
  #     fly scale count 50 -a yukpo-fly-backend
  max_machines_running = 25

  # ✅ 2026-05-17 — Soft/hard divisés par 6 après load test : 300/600 ne
  # déclenchait JAMAIS le scale-up (test à 200 VU = ~200 conn, sous le soft).
  # Maintenant 50 soft → scale-up dès 50 conn/VM, bien avant la dégradation.
  # 25 VM × 50 soft = 1 250 conn pour déclencher scale max ; 25 × 200 hard = 5 000.
  # Pour vraiment supporter 10 000 conn : passer max_machines à 50+ ou upgrade VM
  # (shared-cpu-2x:4096MB), à valider avec un test loader.io 10k VU.
  [http_service.concurrency]
    type = "connections"
    soft_limit = 50
    hard_limit = 200

  [http_service.http_options]
    response_timeout = 120         # 2 min — marge pour appels LLM lourds
    # Idle timeout court → libère vite les conn pour que l'autoscaler
    # puisse redescendre rapidement et tuer les VM excédentaires.
    idle_timeout = 30

[[vm]]
  # ✅ 2026-05-16 — Passage à 2 GB :
  #   - Cold-start réduit (la JVM-like init de sqlx + tokio + ort_sys tient mieux)
  #   - Headroom mémoire pour cache Redis local + multiplexage connexions DB
  #   - Coût marginal : ~$10/mois supplémentaire par VM idle (vs 1 GB)
  memory = "2gb"
  cpu_kind = "shared"
  cpus = 1

# Health check Fly (différent du HEALTHCHECK Docker, plus rapide)
# ✅ 2026-05-16 — grace_period réduit : avec 2 GB et binaire stripped,
# le boot Rust + pool warm-up tient en ~25-30 s. 45 s = marge confort.
[checks]
  [checks.health]
    grace_period = "45s"
    interval = "10s"               # check + fréquent → détection panne plus rapide
    method = "get"
    path = "/health"
    port = 8080
    timeout = "5s"                 # /health doit être ultra-rapide (sans hit DB)
    type = "http"

# ✅ Patch 2026-05-12 — Shutdown gracieux lors du scale-down auto :
# Fly envoie SIGINT (au lieu de SIGTERM), laisse 30s aux requêtes en cours
# de se terminer, puis kill. Évite de couper brutalement un appel LLM en cours.
# Note : nécessite que le binaire écoute SIGINT (axum::serve().with_graceful_shutdown).
kill_signal = "SIGINT"
kill_timeout = 30
