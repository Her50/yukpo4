# Configuration Fly.io pour le backend Yukpo (apps bourse, pharmacie, restaurant).
# Déploiement temporaire — remplace GCP Cloud Run pendant la coupure facturation.
#
# Caractéristiques :
#   - Auto-scale horizontal via concurrence (req/s)
#   - VM 1GB pour démarrer (free tier compatible si org dédiée)
#   - Modules GPU/Broll/Stream désactivés par env var (non utilisés par les 3 apps)
#   - Health check sur /health
#   - Région CDG (Paris) — même que yukpo_assurance, latence minimale

app = "yukpo-fly-backend"
primary_region = "cdg"

[build]
  # Dockerfile dédié Fly : compile sans la feature `gpu` (lourde et inutile pour bourse/pharma/resto).
  # Évite les OOM lors du build remote Fly (limité à 4-6 GB RAM par défaut).
  dockerfile = "Dockerfile.fly"

[env]
  # Ports + log
  PORT = "8080"
  HOST = "0.0.0.0"
  RUST_LOG = "info"
  APP_ENV = "production"
  CLOUD_RUN = "false"        # ✅ flag : on n'est plus sur Cloud Run, désactive les hacks GCP-spécifiques

  # ✅ Modules **désactivés** sur Fly (non utilisés par bourse/pharma/resto) :
  GPU_ENABLED = "false"
  ENABLE_AI_OPTIMIZATIONS = "true"

  # Pool DB (à ajuster selon Fly Postgres single-node max ~95 connexions)
  DB_POOL_SIZE = "20"
  DB_POOL_MIN_SIZE = "2"
  DB_ACQUIRE_TIMEOUT_SECS = "10"

  # Sécurité / billing Yukpo
  YUKPO_IA_TOKEN_MULTIPLIER = "20"
  YUKPO_SIGNUP_BONUS_TOKENS = "4000"
  YUKPO_IA_EXEMPT_ALL_PARTNERS = "true"   # phase de lancement : tous partenaires gratuits

  # Patch H3 (2026-05-12) — Liste CSV des user_id des admins de la librairie
  # Yukpo officielle. Ils ont les mêmes droits qu'un super_admin sur les
  # endpoints admin Bourse (marketplace-overview, recover_consignation, etc.).
  # Les libraires externes (partenaires) ne sont PAS dans cette liste.
  # Exemple : "1,42,108". Vide ou absent = aucun admin librairie officielle.
  YUKPO_OFFICIAL_LIBRAIRIE_USER_IDS = ""

  # Migrations auto au démarrage (sqlx::migrate!)
  ENABLE_AUTO_MIGRATIONS = "true"

[http_service]
  internal_port = 8080
  force_https = true
  # ✅ Patch 2026-05-12 — Autoscaling intelligent pour la phase test :
  #   - 1 seule machine en idle (économie phase test) ; scale automatique sous charge
  #   - auto_stop_machines = "stop" : arrête les VMs excédentaires après ~5 min idle
  #   - auto_start_machines = true : démarre des VMs supplémentaires quand soft_limit atteint
  # Coût en phase test ≈ inchangé (1 VM 1 GB / 1 vCPU) ; explose à la demande seulement.
  # Pour passer en prod HA : remettre min_machines_running = 2 (zéro cold-start).
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  # ✅ Concurrence orientée connexions (et non requêtes), car les requêtes LLM
  # durent 5-30 s : on saturerait `requests` bien avant la vraie capacité réseau.
  # Avec type = "connections", Fly scale dès que les sockets ouvertes dépassent
  # le seuil — plus pertinent pour une API qui mixe REST courts + LLM longs.
  # Capacité visée : 200 conn × N machines → 1 machine = 200, 4 machines = 800,
  # 16 machines (plafond Fly par défaut) = 3200 connexions simultanées.
  # Pour 10k users actifs : pas un problème (pas tous connectés en même temps).
  [http_service.concurrency]
    type = "connections"
    soft_limit = 200
    hard_limit = 350

  [http_service.http_options]
    response_timeout = 120         # 2 min — marge pour appels LLM lourds
    # Idle timeout court pour libérer les connexions plus vite et permettre
    # à l'autoscaler de redescendre quand le pic est passé.
    idle_timeout = 60

[[vm]]
  # Démarrage minimal — 1 GB suffit pour Rust Axum + sqlx (très léger).
  # Vertical scaling manuel : `fly scale memory 2gb -a yukpo-fly-backend` si RAM saturée.
  # Cf. scripts/fly-monitor-and-scale.sh pour automatisation (cron horaire).
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1

# Health check Fly (différent du HEALTHCHECK Docker, plus rapide)
[checks]
  [checks.health]
    grace_period = "60s"           # 1 min pour boot Rust + connexion DB + migrations
    interval = "15s"
    method = "get"
    path = "/health"
    port = 8080
    timeout = "10s"
    type = "http"

# ✅ Patch 2026-05-12 — Shutdown gracieux lors du scale-down auto :
# Fly envoie SIGINT (au lieu de SIGTERM), laisse 30s aux requêtes en cours
# de se terminer, puis kill. Évite de couper brutalement un appel LLM en cours.
# Note : nécessite que le binaire écoute SIGINT (axum::serve().with_graceful_shutdown).
kill_signal = "SIGINT"
kill_timeout = 30
