# ✅ Phase 3 - Configuration Prometheus
# Scrape config pour collecter les métriques du backend Yukpo

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'yukpo-production'
    environment: 'production'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          # - alertmanager:9093

# Load rules once and periodically evaluate them
rule_files:
  - "prometheus_alerts.yml"

# Scrape configurations
scrape_configs:
  # ✅ Backend Yukpo - Métriques Prometheus
  - job_name: 'yukpo-backend'
    scrape_interval: 15s
    scrape_timeout: 10s
    metrics_path: '/metrics/prometheus'
    static_configs:
      - targets:
          - 'localhost:3001'
        labels:
          service: 'yukpo-backend'
          instance: 'backend-1'
    
    # Si plusieurs instances (scaling horizontal)
    # - targets:
    #     - 'backend-1:3001'
    #     - 'backend-2:3001'
    #     - 'backend-3:3001'

  # ✅ Métriques système (optionnel)
  - job_name: 'node-exporter'
    scrape_interval: 15s
    static_configs:
      - targets:
          - 'localhost:9100'
        labels:
          service: 'system'

  # ✅ Métriques PostgreSQL (optionnel - nécessite postgres_exporter)
  - job_name: 'postgres'
    scrape_interval: 30s
    static_configs:
      - targets:
          - 'localhost:9187'
        labels:
          service: 'postgresql'

  # ✅ Métriques Redis (optionnel - nécessite redis_exporter)
  - job_name: 'redis'
    scrape_interval: 30s
    static_configs:
      - targets:
          - 'localhost:9121'
        labels:
          service: 'redis'
