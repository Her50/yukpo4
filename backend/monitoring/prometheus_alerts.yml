# ✅ Phase 3 - Alertes Prometheus pour optimisations livraison
# Fichier de règles d'alerte Prometheus

groups:
  - name: delivery_critical
    interval: 30s
    rules:
      # ✅ Phase 1: Pool DB
      - alert: DeliveryDBPoolExhausted
        expr: delivery_db_pool_active / delivery_db_pool_size > 0.9
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Pool DB presque épuisé"
          description: "Pool DB à {{ $value | humanizePercentage }} de capacité ({{ $labels.instance }})"

      - alert: DeliveryDBPoolWaitTimeHigh
        expr: rate(delivery_db_pool_wait_time_seconds_sum[5m]) > 1.0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Temps d'attente pool DB élevé"
          description: "Temps d'attente moyen: {{ $value }}s ({{ $labels.instance }})"

      # ✅ Phase 1: Matching Algorithm
      - alert: DeliveryMatchingQueueDepthHigh
        expr: delivery_matching_queue_depth > 1000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "File de matching surchargée"
          description: "{{ $value }} livraisons en attente de matching ({{ $labels.instance }})"

      - alert: DeliveryMatchingFailureRateHigh
        expr: |
          rate(delivery_matching_failed_total[5m]) / 
          (rate(delivery_matching_started_total[5m]) + 0.001) > 0.2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Taux d'échec matching élevé"
          description: "{{ $value | humanizePercentage }} d'échecs ({{ $labels.instance }})"

      # ✅ Phase 1: Cache
      - alert: DeliveryCacheHitRateLow
        expr: delivery_cache_matching_hit_rate < 0.5
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Cache hit rate faible"
          description: "Hit rate: {{ $value | humanizePercentage }} ({{ $labels.instance }})"

      # ✅ Phase 2: Rate Limiting
      - alert: DeliveryRateLimitBlockedHigh
        expr: rate(delivery_rate_limit_blocked_total[5m]) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Taux de blocage rate limiting élevé"
          description: "{{ $value }} requêtes/s bloquées ({{ $labels.instance }})"

      # ✅ Phase 2: WebSocket
      - alert: DeliveryWebSocketErrorsHigh
        expr: rate(delivery_ws_errors_total[5m]) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Erreurs WebSocket élevées"
          description: "{{ $value }} erreurs/s ({{ $labels.instance }})"

      - alert: DeliveryWebSocketConnectionsHigh
        expr: delivery_ws_connections_current > 100000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Nombre de connexions WebSocket élevé"
          description: "{{ $value }} connexions actives ({{ $labels.instance }})"

      # ✅ Phase 2: Partitionnement
      - alert: DeliveryArchiveSizeHigh
        expr: delivery_archive_size > 1000000
        for: 1h
        labels:
          severity: info
        annotations:
          summary: "Taille archive importante"
          description: "{{ $value }} livraisons archivées ({{ $labels.instance }})"

  - name: delivery_performance
    interval: 1m
    rules:
      # ✅ Phase 1: Performance Matching
      - alert: DeliveryMatchingLatencyHigh
        expr: histogram_quantile(0.95, rate(delivery_matching_duration_seconds_bucket[5m])) > 2.0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Latence matching élevée (p95)"
          description: "P95: {{ $value }}s ({{ $labels.instance }})"

      # ✅ Phase 2: Performance WebSocket
      - alert: DeliveryWebSocketFlushLatencyHigh
        expr: histogram_quantile(0.95, rate(delivery_ws_flush_duration_seconds_bucket[5m])) > 0.1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Latence flush WebSocket élevée"
          description: "P95: {{ $value }}s ({{ $labels.instance }})"
