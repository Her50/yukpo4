global:
  # Slack webhook URL - À configurer via variable d'environnement
  slack_api_url: '${SLACK_WEBHOOK_URL}'
  resolve_timeout: 5m

# Templates pour les messages Slack
templates:
  - '/etc/alertmanager/templates/*.tmpl'

# Route des alertes
route:
  receiver: 'slack-alerts'
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 12h
  routes:
    # Alertes critiques (pipeline vidéo, base de données)
    - match:
        severity: critical
      receiver: 'slack-critical'
      continue: true
    
    # Alertes dégradées (performance, latence)
    - match:
        severity: warning
      receiver: 'slack-warning'
      continue: true
    
    # Alertes métriques UX (chat, scroll, navigation)
    - match:
        alertname: ChatMetricsAlert
      receiver: 'slack-ux-metrics'
      repeat_interval: 1h
    
    - match:
        alertname: ProductScrollMetricsAlert
      receiver: 'slack-ux-metrics'
      repeat_interval: 1h
    
    - match:
        alertname: VideoScrollMetricsAlert
      receiver: 'slack-ux-metrics'
      repeat_interval: 1h
    
    - match:
        alertname: NavigationMetricsAlert
      receiver: 'slack-ux-metrics'
      repeat_interval: 1h

# Récepteurs (destinations des alertes)
receivers:
  # Canal Slack pour alertes critiques
  - name: 'slack-critical'
    slack_configs:
      - channel: '#yukpo-alerts-critical'
        title: '🚨 ALERTE CRITIQUE - Yukpomnang'
        text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
        send_resolved: true
        color: 'danger'
        fields:
          - title: 'Instance'
            value: '{{ .CommonLabels.instance }}'
            short: true
          - title: 'Service'
            value: '{{ .CommonLabels.job }}'
            short: true
          - title: 'Environnement'
            value: '{{ .CommonLabels.environment }}'
            short: true

  # Canal Slack pour alertes warning
  - name: 'slack-warning'
    slack_configs:
      - channel: '#yukpo-alerts'
        title: '⚠️ ALERTE WARNING - Yukpomnang'
        text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
        send_resolved: true
        color: 'warning'
        fields:
          - title: 'Instance'
            value: '{{ .CommonLabels.instance }}'
            short: true
          - title: 'Service'
            value: '{{ .CommonLabels.job }}'
            short: true

  # Canal Slack pour métriques UX (chat, scroll, navigation)
  - name: 'slack-ux-metrics'
    slack_configs:
      - channel: '#yukpo-ux-metrics'
        title: '📊 MÉTRIQUES UX - Yukpomnang'
        text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
        send_resolved: false
        color: 'good'
        fields:
          - title: 'Métrique'
            value: '{{ .CommonLabels.metric_name }}'
            short: true
          - title: 'Valeur'
            value: '{{ .CommonLabels.value }}'
            short: true
          - title: 'Seuil'
            value: '{{ .CommonLabels.threshold }}'
            short: true

  # Canal Slack par défaut (toutes les alertes)
  - name: 'slack-alerts'
    slack_configs:
      - channel: '#yukpo-alerts'
        title: '📢 ALERTE - Yukpomnang'
        text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
        send_resolved: true
        color: '{{ if eq .Status "firing" }}danger{{ else }}good{{ end }}'

# Inhibition rules (pour éviter les alertes redondantes)
inhibit_rules:
  # Si le pipeline est en panne, ne pas alerter sur les jobs individuels
  - source_match:
      severity: 'critical'
      alertname: 'PipelineCritical'
    target_match:
      severity: 'warning'
    equal: ['instance', 'job']


