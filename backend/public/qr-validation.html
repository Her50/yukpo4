<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yukpo - QR Code Livraison</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 100%;
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px 20px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 24px;
            margin-bottom: 8px;
        }
        
        .header p {
            opacity: 0.9;
            font-size: 14px;
        }
        
        .content {
            padding: 30px 20px;
        }
        
        .qr-info {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .qr-id {
            font-family: 'Courier New', monospace;
            font-size: 18px;
            color: #667eea;
            font-weight: bold;
            margin-bottom: 8px;
        }
        
        .qr-status {
            font-size: 14px;
            color: #666;
        }
        
        .actions {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .btn {
            padding: 15px 20px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: block;
            text-align: center;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }
        
        .btn-secondary {
            background: #f8f9fa;
            color: #333;
            border: 1px solid #dee2e6;
        }
        
        .btn-secondary:hover {
            background: #e9ecef;
        }
        
        .btn-success {
            background: #28a745;
            color: white;
        }
        
        .btn-success:hover {
            background: #218838;
        }
        
        .loading {
            text-align: center;
            padding: 40px 20px;
        }
        
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #f5c6cb;
        }
        
        .success {
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #c3e6cb;
        }
        
        .warning {
            background: #fff3cd;
            color: #856404;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #ffeaa7;
        }
        
        .delivery-info {
            background: #e3f2fd;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #bbdefb;
        }
        
        .delivery-info h3 {
            color: #1976d2;
            margin-bottom: 8px;
            font-size: 16px;
        }
        
        .delivery-info p {
            color: #424242;
            font-size: 14px;
            line-height: 1.4;
        }
        
        .footer {
            text-align: center;
            padding: 20px;
            font-size: 12px;
            color: #666;
            border-top: 1px solid #eee;
        }
        
        .app-download {
            background: #f8f9fa;
            padding: 20px;
            text-align: center;
            margin: 20px;
            border-radius: 12px;
        }
        
        .app-download h3 {
            margin-bottom: 10px;
            color: #333;
        }
        
        .app-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 15px;
        }
        
        .app-button {
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
        }
        
        .app-button.android {
            background: #3ddc84;
            color: white;
        }
        
        .app-button.ios {
            background: #000;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📦 Yukpo Delivery</h1>
            <p>Validation de livraison par QR Code</p>
        </div>
        
        <div class="content">
            <div id="loading" class="loading">
                <div class="spinner"></div>
                <p>Chargement des informations...</p>
            </div>
            
            <div id="content" style="display: none;">
                <!-- Contenu dynamique -->
            </div>
            
            <div id="app-download" class="app-download" style="display: none;">
                <h3>📱 Téléchargez l'application</h3>
                <p>Pour une meilleure expérience, téléchargez l'application Yukpo</p>
                <div class="app-buttons">
                    <a href="https://play.google.com/store/apps/details?id=com.yukpomnang.mobile" class="app-button android">
                        Android
                    </a>
                    <a href="https://apps.apple.com/app/yukpo" class="app-button ios">
                        iOS
                    </a>
                </div>
            </div>
        </div>
        
        <div class="footer">
            <p>© 2026 Yukpo - Service de livraison intelligent</p>
        </div>
    </div>

    <script>
        // Extraire l'ID du QR code depuis l'URL
        const pathParts = window.location.pathname.split('/');
        const qrId = pathParts[pathParts.length - 1];
        
        if (!qrId || qrId === 'qr') {
            showError('QR code invalide ou manquant');
            return;
        }
        
        // API backend
        const API_BASE = 'https://yukpo-backend-376093909298.europe-west1.run.app';
        
        // Charger les informations du QR code
        async function loadQRInfo() {
            try {
                const response = await fetch(`${API_BASE}/api/librairie-network/qrcode/${qrId}/status`);
                
                if (!response.ok) {
                    if (response.status === 404) {
                        showError('QR code non trouvé ou expiré');
                    } else {
                        showError('Erreur lors du chargement du QR code');
                    }
                    return;
                }
                
                const data = await response.json();
                
                if (data.success) {
                    displayQRInfo(data);
                } else {
                    showError('QR code invalide');
                }
            } catch (error) {
                console.error('Erreur:', error);
                showError('Erreur de connexion au serveur');
            }
        }
        
        // Afficher les informations du QR code
        function displayQRInfo(data) {
            const content = document.getElementById('content');
            const loading = document.getElementById('loading');
            
            let html = '';
            
            // Informations du QR code
            html += `
                <div class="qr-info">
                    <div class="qr-id">ID: ${data.qr_id}</div>
                    <div class="qr-status">Statut: ${getStatusText(data.statut)}</div>
                    <div class="qr-status">Généré: ${new Date(data.date_generation).toLocaleString('fr-FR')}</div>
                    ${data.date_scan ? `<div class="qr-status">Scanné: ${new Date(data.date_scan).toLocaleString('fr-FR')}</div>` : ''}
                </div>
            `;
            
            // Messages selon le statut
            if (data.is_expired) {
                html += '<div class="warning">⚠️ Ce QR code a expiré</div>';
            } else if (data.statut === 'scanne') {
                html += '<div class="success">✅ Ce QR code a déjà été scanné</div>';
            } else {
                html += '<div class="delivery-info"><h3>📦 Validation de livraison</h3><p>Scannez ce QR code avec l\'application Yukpo pour valider la réception de votre colis.</p></div>';
            }
            
            // Actions disponibles
            html += '<div class="actions">';
            
            if (!data.is_expired && data.statut !== 'scanne') {
                // Bouton pour scanner avec l'app
                html += `
                    <button class="btn btn-primary" onclick="openInApp()">
                        📱 Ouvrir dans l'application
                    </button>
                `;
                
                // Bouton pour scanner manuellement
                html += `
                    <button class="btn btn-success" onclick="validateQR()">
                        ✅ Valider la livraison
                    </button>
                `;
            }
            
            // Bouton pour vérifier le statut
            html += `
                <button class="btn btn-secondary" onclick="checkStatus()">
                    📊 Actualiser le statut
                </button>
            `;
            
            html += '</div>';
            
            content.innerHTML = html;
            loading.style.display = 'none';
            content.style.display = 'block';
            
            // Afficher le téléchargement de l'app après un délai
            setTimeout(() => {
                document.getElementById('app-download').style.display = 'block';
            }, 3000);
        }
        
        // Ouvrir dans l'application
        function openInApp() {
            const appUrl = `yukpomnang://qr/${qrId}`;
            const fallbackUrl = window.location.href;
            
            // Essayer d'ouvrir l'app
            window.location.href = appUrl;
            
            // Fallback vers le navigateur si l'app n'est pas installée
            setTimeout(() => {
                window.location.href = fallbackUrl;
            }, 2000);
        }
        
        // Valider le QR code (scan web)
        async function validateQR() {
            const content = document.getElementById('content');
            
            try {
                const response = await fetch(`${API_BASE}/api/librairie-network/qrcode/${qrId}/scan`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        scan_par: 1, // ID par défaut pour scan web
                        location_scan: getLocationString(),
                        notes: 'Scan via page web'
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showSuccess('✅ Livraison validée avec succès!');
                    setTimeout(() => loadQRInfo(), 2000); // Recharger les infos
                } else {
                    showError(data.message || 'Erreur lors de la validation');
                }
            } catch (error) {
                console.error('Erreur validation:', error);
                showError('Erreur lors de la validation du QR code');
            }
        }
        
        // Vérifier le statut
        function checkStatus() {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('content').style.display = 'none';
            loadQRInfo();
        }
        
        // Obtenir la localisation
        function getLocationString() {
            return 'Web scan - ' + new Date().toISOString();
        }
        
        // Texte du statut
        function getStatusText(status) {
            const statusMap = {
                'genere': 'Généré',
                'scanne': 'Scanné',
                'expire': 'Expiré'
            };
            return statusMap[status] || status;
        }
        
        // Afficher erreur
        function showError(message) {
            const content = document.getElementById('content');
            const loading = document.getElementById('loading');
            
            content.innerHTML = `
                <div class="error">
                    <strong>❌ Erreur</strong><br>
                    ${message}
                </div>
                <div class="actions">
                    <button class="btn btn-secondary" onclick="window.location.reload()">
                        🔄 Réessayer
                    </button>
                </div>
            `;
            
            loading.style.display = 'none';
            content.style.display = 'block';
        }
        
        // Afficher succès
        function showSuccess(message) {
            const content = document.getElementById('content');
            
            const tempDiv = document.createElement('div');
            tempDiv.className = 'success';
            tempDiv.innerHTML = `<strong>${message}</strong>`;
            
            content.insertBefore(tempDiv, content.firstChild);
            
            // Supprimer après 3 secondes
            setTimeout(() => {
                tempDiv.remove();
            }, 3000);
        }
        
        // Charger au démarrage
        loadQRInfo();
        
        // Auto-rafraîchissement toutes les 30 secondes
        setInterval(() => {
            if (document.getElementById('content').style.display !== 'none') {
                checkStatus();
            }
        }, 30000);
    </script>
</body>
</html>
