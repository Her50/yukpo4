<?xml version="1.0" encoding="UTF-8"?>
<!-- VERSION SIMPLIFIÉE - Meilleure pour petites tailles -->
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient fond -->
    <linearGradient id="bgSimple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F172A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E293B;stop-opacity:1" />
    </linearGradient>
    
    <!-- Gradient Y -->
    <linearGradient id="ySimple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F7971E;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFD200;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366F1;stop-opacity:1" />
    </linearGradient>
    
    <!-- Motif Ndop simplifié - seulement losanges principaux -->
    <pattern id="ndopSimple" x="0" y="0" width="120" height="120" patternUnits="userSpaceOnUse">
      <!-- Grand losange -->
      <path d="M 60 0 L 120 60 L 60 120 L 0 60 Z" 
            fill="none" 
            stroke="#334155" 
            stroke-width="3" 
            opacity="0.4"/>
      
      <!-- Point central -->
      <circle cx="60" cy="60" r="4" fill="#6366F1" opacity="0.6"/>
    </pattern>
    
    <!-- Ombre simple -->
    <filter id="shadowSimple">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dx="0" dy="10" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.4"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Fond -->
  <rect width="1024" height="1024" fill="url(#bgSimple)" rx="200"/>
  
  <!-- Motif Ndop simplifié -->
  <rect width="1024" height="1024" fill="url(#ndopSimple)" rx="200"/>
  
  <!-- Cercle subtil derrière le Y -->
  <circle cx="512" cy="480" r="340" fill="#1E293B" opacity="0.4"/>
  
  <!-- Lettre Y - Version plus épaisse et claire -->
  <g filter="url(#shadowSimple)">
    <!-- Branche gauche (plus épaisse) -->
    <path d="M 260 240 L 512 510 L 460 560 L 208 290 Z" 
          fill="url(#ySimple)"/>
    
    <!-- Branche droite (plus épaisse) -->
    <path d="M 764 240 L 512 510 L 564 560 L 816 290 Z" 
          fill="url(#ySimple)"/>
    
    <!-- Tige centrale (plus épaisse) -->
    <rect x="460" y="480" width="104" height="320" 
          fill="url(#ySimple)" 
          rx="10"/>
  </g>
  
  <!-- Bordure subtile pour définition -->
  <rect width="1024" height="1024" 
        fill="none" 
        stroke="url(#ySimple)" 
        stroke-width="4" 
        opacity="0.3" 
        rx="200"/>
</svg>




