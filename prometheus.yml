global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Scrape du backend Yukpo (vidéo + delivery) via /metrics
  # ✅ Backend déployé sur Render (cloud) en production
  - job_name: 'yukpo-backend'
    metrics_path: /metrics
    scheme: https
    static_configs:
      - targets:
          - 'yukpomnang.onrender.com'  # ✅ URL Render backend en production
        labels:
          instance: 'yukpo-backend-render'
          environment: 'production'
          deployment: 'cloud'
    
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'yukpo-backend-render'
