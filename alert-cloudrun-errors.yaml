displayName: "Yukpo — taux d'erreurs HTTP 5xx > 1%"
documentation:
  content: "yukpo-backend renvoie >1% d'erreurs 5xx. App probablement saturée ou bug critique."
  mimeType: text/markdown
combiner: OR
conditions:
  - displayName: "5xx error rate > 1%"
    conditionThreshold:
      filter: 'resource.type = "cloud_run_revision" AND resource.labels.service_name = "yukpo-backend" AND metric.type = "run.googleapis.com/request_count" AND metric.labels.response_code_class = "5xx"'
      comparison: COMPARISON_GT
      thresholdValue: 5
      duration: 180s
      aggregations:
        - alignmentPeriod: 60s
          perSeriesAligner: ALIGN_RATE
notificationChannels:
  - projects/yukpo-project/notificationChannels/649839886922112123
alertStrategy:
  autoClose: 1800s
