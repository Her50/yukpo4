[build]
  publish = "dist-lite"
  command = "npm install && npm run build:lite"

[build.environment]
  VITE_APP_ENV = "production"

[[redirects]]
  from = "/api/*"
  to = "https://yukpo-backend-376093909298.europe-west1.run.app/api/:splat"
  status = 200
  force = true
  headers = {Access-Control-Allow-Origin = "*"}

[[redirects]]
  from = "/auth/*"
  to = "https://yukpo-backend-376093909298.europe-west1.run.app/auth/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
