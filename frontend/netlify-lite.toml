[build]
  publish = "dist-lite"
  command = "npm install && npm run build:lite"

[build.environment]
  VITE_APP_ENV = "production"

# Backend cible :
# ✅ ACTIF — 2026-05-16 : Cloudflare proxy → Fly (https://api.yukpomnang.com)
# 💤 Fly direct — fallback sans CF (https://yukpo-fly-backend.fly.dev)
# 💤 PRINCIPAL — GCP Cloud Run (https://yukpo-backend-376093909298.europe-west1.run.app)

[[redirects]]
  from = "/api/*"
  to = "https://api.yukpomnang.com/api/:splat"
  # to = "https://yukpo-fly-backend.fly.dev/api/:splat"  # 💤 Fly direct (sans CF)
  # to = "https://yukpo-backend-376093909298.europe-west1.run.app/api/:splat"  # 💤 GCP (principal)
  status = 200
  force = true
  # ✅ 2026-05-21 — Pas de ACAO=* (incompatible cookie httpOnly withCredentials).

[[redirects]]
  from = "/auth/*"
  to = "https://api.yukpomnang.com/auth/:splat"
  # to = "https://yukpo-fly-backend.fly.dev/auth/:splat"  # 💤 Fly direct (sans CF)
  # to = "https://yukpo-backend-376093909298.europe-west1.run.app/auth/:splat"  # 💤 GCP (principal)
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    # ✅ 2026-05-21 — Security headers MAX (aligné avec frontend/netlify.toml)
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self), camera=(self), microphone=(self), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://maps.googleapis.com https://maps.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://maps.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://api.yukpomnang.com wss://api.yukpomnang.com https://yukpo-fly-backend.fly.dev wss://yukpo-fly-backend.fly.dev https://yukpo-backend-376093909298.europe-west1.run.app wss://yukpo-backend-376093909298.europe-west1.run.app https://maps.googleapis.com https://*.tile.openstreetmap.org https://photon.komoot.io https://api.openai.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests"
