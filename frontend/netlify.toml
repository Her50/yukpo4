# ✅ 2026-05-21 — CORS supprimé des blocs [[headers]] pour /api/*, /auth/*, etc.
# Le backend (Cloudflare → Fly) renvoie déjà ses propres Access-Control-Allow-*
# avec credentials=true et origines whitelist. Doubler ici avec wildcard
# briserait l'auth cookie httpOnly (`withCredentials: true` refuse wildcard).
# Les requêtes vers /api/*, /auth/*, /services/*, etc. sont same-origin via
# le proxy Netlify (status 200), donc CORS pas nécessaire côté Netlify.

[[headers]]
  for = "/*"
  [headers.values]
    # Anti-clickjacking
    X-Frame-Options = "DENY"
    # ✅ 2026-05-21 — X-XSS-Protection RETIRÉ : header déprécié, peut introduire
    # des vulnérabilités sur certains anciens browsers. CSP est la protection
    # moderne. Cf. https://owasp.org/www-project-secure-headers/#x-xss-protection
    # Empêche le MIME-sniffing
    X-Content-Type-Options = "nosniff"
    # HSTS — force HTTPS 2 ans, sous-domaines inclus. Tous les domains Yukpo
    # sont en HTTPS via Netlify/Fly, donc safe à activer.
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    # Limite la fuite d'URL référente vers les tiers (privacy + sécurité)
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Restrictions API browser. Autorisé : geo (recherche prox), camera (scan
    # programme/QR), microphone (chat vocal éventuel). Reste désactivé.
    Permissions-Policy = "geolocation=(self), camera=(self), microphone=(self), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()"
    # Isolation cross-origin (limite Spectre + clic-jacking via popups)
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    # ✅ 2026-05-21 — CSP MODE ENFORCING (plus en Report-Only).
    # Bloque réellement toute exécution/exfiltration interdite.
    #
    # Inventaire whitelist (grep préventif du frontend pour éviter les
    # CSP violations en prod, sans attendre que ça casse) :
    #   script-src :
    #     • maps.googleapis.com / maps.gstatic.com : Google Maps JS SDK
    #     • www.google.com / www.gstatic.com : reCAPTCHA v2/v3 (grecaptcha)
    #   style-src :
    #     • fonts.googleapis.com : Google Fonts
    #     • maps.googleapis.com : styles Maps
    #   img-src : https: (médias Wasabi/CloudFront/UI-avatars/Unsplash placeholders)
    #   font-src : fonts.gstatic.com : Google Fonts assets
    #   connect-src (XHR/fetch/WS) :
    #     • api.yukpomnang.com : backend prod (Cloudflare proxy → Fly)
    #     • yukpo-fly-backend.fly.dev : fallback Fly direct
    #     • yukpo-backend-...run.app : fallback GCP principal
    #     • maps.googleapis.com : Geocoding + Places
    #     • *.tile.openstreetmap.org : tuiles OSM
    #     • photon.komoot.io : geocoding open-source
    #     • api.openai.com : assistant IA Yukpo (recherche+matching)
    #     • api.exchangerate.host : conversion devises
    #     • translation.googleapis.com : Google Translate API (i18n dynamique)
    #     • www.googleapis.com : Google Geolocation API
    #     • server.arcgisonline.com : tuiles satellite ArcGIS (fallback)
    #   frame-src :
    #     • www.google.com : iframe reCAPTCHA
    #   worker-src 'self' + manifest-src 'self' : PWA (sw.js + manifest.json)
    #   media-src : https: pour vidéos d'appréciation état livre (Wasabi)
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://maps.googleapis.com https://maps.gstatic.com https://www.google.com https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://maps.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://api.yukpomnang.com wss://api.yukpomnang.com https://yukpo-fly-backend.fly.dev wss://yukpo-fly-backend.fly.dev https://yukpo-backend-376093909298.europe-west1.run.app wss://yukpo-backend-376093909298.europe-west1.run.app https://maps.googleapis.com https://*.tile.openstreetmap.org https://photon.komoot.io https://api.openai.com https://api.exchangerate.host https://translation.googleapis.com https://www.googleapis.com https://server.arcgisonline.com; media-src 'self' blob: https:; worker-src 'self'; manifest-src 'self'; frame-src 'self' https://www.google.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests"
