  from = "/auth/*"
  to = "https://yukpo-fly-backend.fly.dev/auth/:splat"
  # to = "https://yukpo-backend-376093909298.europe-west1.run.app/auth/:splat"  # 💤 GCP (principal)
  # to = "https://api.yukpomnang.com/auth/:splat"  # 🗄️ AWS (archive)
