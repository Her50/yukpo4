[build]
  publish = "dist-bourse"
  command = "npm install && npx vite build --config vite.bourse.config.ts"

[build.environment]
  VITE_API_BASE_URL = ""
  VITE_APP_ENV = "production"
  VITE_APP_DEBUG = "false"

# Backend cible des redirects :
# ✅ ACTIF — 2026-05-16 : Fly.io (https://yukpo-fly-backend.fly.dev)
#    Bascule temporaire pendant que GCP est en panne / facturation suspendue.
# 💤 PRINCIPAL — GCP Cloud Run (https://yukpo-backend-376093909298.europe-west1.run.app)
#    Backend long terme. Pour rebasculer : décommenter les lignes GCP ci-dessous
#    et commenter les lignes Fly correspondantes.
# 🗄️ ARCHIVE — AWS ECS (https://api.yukpomnang.com)
#    Plus utilisé ; gardé pour mémoire.

[[redirects]]
  from = "/api/*"
  to = "https://yukpo-fly-backend.fly.dev/api/:splat"
  # to = "https://yukpo-backend-376093909298.europe-west1.run.app/api/:splat"  # 💤 GCP (principal)
  # to = "https://api.yukpomnang.com/api/:splat"  # 🗄️ AWS (archive)
  status = 200
  force = true
  headers = {Access-Control-Allow-Origin = "*"}

