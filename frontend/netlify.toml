[build]
  publish = "dist-bourse"
  command = "npm install && npx vite build --config vite.bourse.config.ts"

[build.environment]
  VITE_API_BASE_URL = ""
  VITE_APP_ENV = "production"
  VITE_APP_DEBUG = "false"

# Backend cible des redirects :
# ✅ ACTIF — 2026-05-16 : Cloudflare proxy → Fly (https://api.yukpomnang.com)
#    Cloudflare protège avec : WAF Managed Free Ruleset, DDoS L7 mitigation,
#    SSL Full Strict, rate-limit anti-brute-force /api/auth/* (3 req/10s/IP),
#    bot management, hides Fly origin IP.
# 💤 Fly direct — fallback sans CF (https://yukpo-fly-backend.fly.dev)
#    Si Cloudflare a un incident, swap activement vers cette ligne.
# 💤 PRINCIPAL — GCP Cloud Run (https://yukpo-backend-376093909298.europe-west1.run.app)
#    Backend long terme. Réactiver quand GCP repart.

[[redirects]]
  from = "/api/*"
  to = "https://api.yukpomnang.com/api/:splat"
  # to = "https://yukpo-fly-backend.fly.dev/api/:splat"  # 💤 Fly direct (sans CF)
  # to = "https://yukpo-backend-376093909298.europe-west1.run.app/api/:splat"  # 💤 GCP (principal)
  status = 200
  force = true
  # ✅ 2026-05-21 — CORS supprimé : la requête est same-origin via Netlify proxy.
  # Garder Access-Control-Allow-Origin = "*" briserait la nouvelle auth cookie
  # httpOnly (`withCredentials: true` refuse les wildcards d'origine).

[[redirects]]
  from = "/auth/*"
  to = "https://api.yukpomnang.com/auth/:splat"
  # to = "https://yukpo-fly-backend.fly.dev/auth/:splat"  # 💤 Fly direct (sans CF)
  # to = "https://yukpo-backend-376093909298.europe-west1.run.app/auth/:splat"  # 💤 GCP (principal)
  status = 200
  force = true
  # ✅ 2026-05-21 — Cf. /api/*. Pas de CORS wildcard avec withCredentials.

