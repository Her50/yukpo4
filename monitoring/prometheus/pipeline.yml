global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: 'backend-pipeline'
    metrics_path: /internal/metrics/pipeline
    scheme: http
    static_configs:
      - targets:
          - backend.internal:3001
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: yukpo-backend


