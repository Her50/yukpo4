version: '3.8'

services:
  # 🗄️ Base de données PostgreSQL avec pgvector
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: yukpomnang
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./pgvector_pg16_files:/docker-entrypoint-initdb.d
    networks:
      - yukpo-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # 🚀 Backend Rust
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        DATABASE_URL: "postgresql://yukpo_db_user:88X47ZWBiLkX5WatFcLU4KQ4rgaHYml4@dpg-d2t7ntbuibrs73eh9tvg-a.frankfurt-postgres.render.com/yukpo_db"
    environment:
      - LIVEKIT_API_URL=http://livekit:7880
      - LIVEKIT_WS_URL=ws://localhost:7880
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:-devkey}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:-secret}
      - LIVEKIT_HLS_URL=http://localhost:8080/live
      - LIVEKIT_INGRESS_MODE=rtmp
      - LIVEKIT_ROOM_TTL_SECONDS=7200
      - LIVE_RECORDING_ENABLED=true
      - LIVE_FALLBACK_ENABLED=true
      - SRS_RTMP_URL=rtmp://localhost:1935/live
      - SRS_HLS_URL=http://localhost:8080/live
      - RUST_LOG=info
      - DATABASE_URL=postgresql://yukpo_db_user:88X47ZWBiLkX5WatFcLU4KQ4rgaHYml4@dpg-d2t7ntbuibrs73eh9tvg-a.frankfurt-postgres.render.com/yukpo_db
      - JWT_SECRET=c1daf37cdbc083d458dadf8510af6722929d17bd931e9dfda90ee4ed74d6f2b6
      - CORS_ORIGIN=*
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      livekit:
        condition: service_started
      srs:
        condition: service_started
    networks:
      - yukpo-network
    volumes:
      - ./backend/uploads:/app/uploads
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:3001/healthz || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # 🌐 Frontend React
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - VITE_API_BASE_URL=http://localhost:3001
      - VITE_APP_ENV=development
    depends_on:
      - backend
    networks:
      - yukpo-network

  livekit:
    image: livekit/livekit-server:latest
    command:
      - livekit-server
      - "--bind=0.0.0.0"
      - "--keys=${LIVEKIT_KEYS:-devkey:secret}"
      - "--config-body=room: {}"
    environment:
      - LIVEKIT_KEYS=${LIVEKIT_KEYS:-devkey:secret}
    ports:
      - "7880:7880" # HTTP / WebRTC signaling
      - "7881:7881" # WebRTC fallback
      - "7882:7882/udp" # RTP
    networks:
      - yukpo-network

  srs:
    image: ossrs/srs:5
    ports:
      - "1935:1935" # RTMP
      - "8080:8080" # HLS HTTP
    volumes:
      - ./config/srs/srs.conf:/usr/local/srs/conf/srs.conf:ro
    command:
      - livekit-server
      - "--bind=0.0.0.0"
      - "--keys=${LIVEKIT_KEYS:-devkey:secret}"
      - "--config-body=room: {}"
    networks:
      - yukpo-network

  # ⚖️ Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - yukpo-network

  # 📊 Prometheus pour métriques backend (vidéo + delivery)
  prometheus:
    image: prom/prometheus:v2.52.0
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    ports:
      - "9090:9090"
    depends_on:
      - backend
    networks:
      - yukpo-network

  # 📈 Grafana pour dashboards
  grafana:
    image: grafana/grafana:11.0.0
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SERVER_DOMAIN=localhost
      # Pour Hetzner, adapter le domaine public ou utiliser un reverse proxy (nginx/traefik)
    ports:
      - "3002:3000" # 3000 est déjà utilisé par le frontend
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - yukpo-network

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:


networks:
  yukpo-network:
    driver: bridge
