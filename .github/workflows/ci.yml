name: Yukpo Phase 5 CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Rust)
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    env:
      SQLX_OFFLINE: "true"
      DATABASE_URL: ${{ secrets.DATABASE_URL_OFFLINE }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
          cache-on-failure: true

      - name: Install system dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libssl-dev \
            libpq-dev \
            postgresql-client \
            clang \
            build-essential \
            ca-certificates

      - name: Build strict SQLx migration source
        if: matrix.os == 'ubuntu-latest'
        shell: pwsh
        run: |
          ./scripts/build_sqlx_migrations_strict_source.ps1 `
            -DatabaseUrl "${{ secrets.DATABASE_URL_OFFLINE }}" `
            -SourceDir "migrations" `
            -TargetDir "migrations_strict" `
            -AmbiguousMapPath "scripts/sqlx_ambiguous_map.json"

      - name: Verify strict SQLx checksums
        if: matrix.os == 'ubuntu-latest'
        shell: pwsh
        run: |
          ./scripts/verify_sqlx_strict_checksums.ps1 `
            -DatabaseUrl "${{ secrets.DATABASE_URL_OFFLINE }}" `
            -SourceDir "migrations_strict"

      - name: Check sqlx-data.json or .sqlx directory
        if: matrix.os == 'ubuntu-latest'
        run: |
          if [ -f sqlx-data.json ]; then
            echo "✅ sqlx-data.json found"
            exit 0
          elif [ -d .sqlx ]; then
            echo "✅ .sqlx directory found"
            COUNT=$(find .sqlx -type f 2>/dev/null | wc -l || echo 0)
            echo "Cache contains $COUNT files"
            if [ "$COUNT" -eq 0 ]; then
              echo "❌ ERROR: .sqlx directory is empty!"
              exit 1
            fi
            exit 0
          else
            echo "❌ ERROR: Neither sqlx-data.json nor .sqlx directory found"
            echo "If using sqlx::query!() macros, you need to generate metadata:"
            echo "  Run 'cargo sqlx prepare -- --lib' locally with a valid DATABASE_URL"
            echo "  Then commit sqlx-data.json or .sqlx/ directory"
            exit 1
          fi
        shell: bash

      - name: Check sqlx-data.json or .sqlx directory (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          if (Test-Path sqlx-data.json) {
            Write-Host "✅ sqlx-data.json found"
          } elseif (Test-Path .sqlx) {
            Write-Host "✅ .sqlx directory found"
            $count = (Get-ChildItem .sqlx -Recurse -File | Measure-Object).Count
            Write-Host "Cache contains $count files"
            if ($count -eq 0) {
              Write-Host "❌ ERROR: .sqlx directory is empty!"
              exit 1
            }
          } else {
            Write-Host "❌ ERROR: Neither sqlx-data.json nor .sqlx directory found"
            Write-Host "If using sqlx::query!() macros, you need to generate metadata:"
            Write-Host "  Run 'cargo sqlx prepare -- --lib' locally with a valid DATABASE_URL"
            Write-Host "  Then commit sqlx-data.json or .sqlx/ directory"
            exit 1
          }
        shell: pwsh

      - name: Format Rust code (auto-fix on schedule)
        if: github.event_name == 'schedule' && matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          cargo fmt
          if ! git diff --exit-code; then
            echo "⚠️ Des changements de formatage détectés lors du cron"
            echo "⚠️ Création d'un commit automatique..."
            # ✅ FIXED: Add error handling for Git commands
            git config --local user.email "github-actions[bot]@users.noreply.github.com" || echo "⚠️ Git config failed"
            git config --local user.name "github-actions[bot]" || echo "⚠️ Git config failed"
            git add -u || echo "⚠️ Git add failed"
            git commit -m "chore: formatage automatique du code Rust [skip ci]" || echo "⚠️ Git commit failed (no changes or permission issue)"
            # ✅ FIXED: Add error handling for git push
            if git push origin HEAD:${{ github.ref }} 2>/dev/null; then
              echo "✅ Push successful"
            else
              echo "⚠️ Impossible de push (peut-être pas de permissions ou pas de changements)"
            fi
          else
            echo "✅ Aucun changement de formatage nécessaire"
          fi

      - name: Cargo fmt check
        if: github.event_name != 'schedule'
        run: cargo fmt -- --check

      - name: Cargo clippy
        run: cargo clippy --all-targets -- -W clippy::all
        continue-on-error: true

      - name: Cargo test
        run: cargo test --all --locked

      - name: Cargo build release
        run: cargo build --release --locked

      - name: Upload sqlx data
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: sqlx-data.json
          path: backend/sqlx-data.json
          if-no-files-found: warn

  frontend:
    name: Frontend (React)
    needs: backend
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: 0
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (no fix)
        run: npm run lint:check

      - name: Run Vitest suite (coverage)
        run: npm run test -- --coverage

      - name: Build production bundle
        run: npm run build

      - name: Install Playwright dependencies
        run: npx playwright install --with-deps

      - name: Upload frontend coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage
          if-no-files-found: warn

      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: warn

  mobile:
    name: Mobile (Expo)
    needs: frontend
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_API_BASE_URL: ${{ secrets.EXPO_PUBLIC_API_BASE_URL }}
      EXPO_PUBLIC_WS_BASE_URL: ${{ secrets.EXPO_PUBLIC_WS_BASE_URL }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests (Vitest + coverage)
        run: npm run test -- --coverage

      - name: Expo web export
        run: npx expo export --platform web --dump-sourcemap --output-dir dist-web

      - name: Upload mobile coverage
        uses: actions/upload-artifact@v4
        with:
          name: mobile-coverage
          path: mobile/coverage
          if-no-files-found: warn

      - name: Upload Expo dist
        uses: actions/upload-artifact@v4
        with:
          name: mobile-dist-web
          path: mobile/dist-web
          if-no-files-found: warn

  video_renderer:
    name: Video renderer (GPU worker)
    needs: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: video-renderer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: video-renderer/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build worker
        run: npm run build

      - name: Render sample job (CPU fallback)
        run: npm run render:sample

      - name: Upload renderer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: renderer-sample
          path: |
            video-renderer/renders
            video-renderer/jobs
          if-no-files-found: warn

  qa_seed:
    name: Seed staging data
    needs: backend
    runs-on: ubuntu-latest
    env:
      STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Seed staging baseline
        run: bash scripts/seed_staging.sh

  playwright_e2e:
    name: Playwright E2E (staging)
    needs: [frontend, qa_seed]
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_TEST_BASE_URL: ${{ secrets.PLAYWRIGHT_TEST_BASE_URL }}
      API_BEARER_TOKEN: ${{ secrets.PLAYWRIGHT_API_TOKEN }}
      PLAYWRIGHT_BROWSERS_PATH: 0
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright suite
        run: npm run test:e2e -- --project=chromium --reporter=html

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          if-no-files-found: warn

  qa_video:
    name: QA Video Pipeline
    needs: [backend, frontend, mobile, video_renderer]
    runs-on: ubuntu-latest
    env:
      QA_ARTIFACTS_DIR: artifacts/video-qa
      QA_MOBILE_CONFIGURATION: android.emu.debug
      QA_PLAYWRIGHT_PROJECT: chromium
      QA_VIDEO_SCENARIOS: audio-premium,fallback-local,livekit-mock,wasabi-storage
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libgbm1 xvfb

      - name: Install Detox & Playwright CLIs
        run: |
          npm install --global detox-cli
          npx playwright install --with-deps

      - name: Run QA pipeline script
        run: bash scripts/run_video_pipeline_qa.sh --ci

      - name: Upload QA artifacts
        uses: actions/upload-artifact@v4
        with:
          name: video-pipeline-qa
          path: artifacts/video-qa
          if-no-files-found: warn

  detox_android:
    name: Detox Android Nightly
    needs: mobile
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      WORKING_DIRECTORY: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: mobile

      - name: Detox Android suite
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          working-directory: mobile
          script: npm run detox:test:android

