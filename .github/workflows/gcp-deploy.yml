name: Deploy to Google Cloud Platform

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'backend/**'
      - '.github/workflows/gcp-deploy.yml'
      - 'scripts/**'
      - '*.md'
  workflow_dispatch:

env:
  PROJECT_ID: yukpo-project
  SERVICE_NAME: yukpo-backend
  REGION: europe-west1
  ARTIFACT_REGISTRY_REPO: yukpo-backend
  IMAGE_NAME: europe-west1-docker.pkg.dev/yukpo-project/yukpo-backend/yukpo-backend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - id: 'auth'
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: 'google-github-actions/setup-gcloud@v2'
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker europe-west1-docker.pkg.dev
          gcloud auth configure-docker gcr.io

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare Dockerfile
        run: |
          if [ ! -f backend/Dockerfile.cloud.optimized ]; then
            echo "ERROR: backend/Dockerfile.cloud.optimized not found!"
            exit 1
          fi
          sed -E \
            -e '/^COPY --from=/! s#^COPY (Cargo\.toml Cargo\.lock) #COPY backend/Cargo.toml backend/Cargo.lock #' \
            -e '/^COPY --from=/! s#^COPY \.sqlx #COPY backend/.sqlx #' \
            -e '/^COPY --from=/! s#^COPY (src|scripts|ia_prompts|config|migrations|blender) #COPY backend/\1 #' \
            -e '/^COPY --from=/! s#^COPY ([^/ ]+\.md) #COPY backend/\1 #' \
            -e '/^COPY --from=/! s#^COPY scripts/([^ ]+) #COPY backend/scripts/\1 #' \
            backend/Dockerfile.cloud.optimized > Dockerfile.build

      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.build
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          build-args: |
            SQLX_OFFLINE=true
            BUILDKIT_INLINE_CACHE=1

      - name: Prepare Environment Variables
        id: prepare-env
        run: |
          echo "Preparing environment variables from GitHub secrets..."
          
          # Créer un fichier JSON pour les variables d'environnement
          # NOTE: DATABASE_URL, REDIS_URL, MONGODB_URL, JWT_SECRET sont gérés comme secrets, pas comme variables
          if command -v jq &> /dev/null; then
            echo '{}' | jq \
              '. + {
                "CLOUD_RUN": "true",
                "ENABLE_AUTO_MIGRATIONS": "true",
                "SQLX_OFFLINE": "true",
                "HOST": "0.0.0.0",
                "RUST_LOG": "info",
                "APP_ENV": "production",
                "GPU_ENABLED": "true",
                "GPU_ENDPOINT": "http://yukpo-gpu-workers:8080",
                "GPU_ZONE": "europe-west1-b",
                "GPU_INSTANCE_NAME": "yukpo-gpu-worker",
                "GCP_PROJECT_ID": "${{ secrets.GCP_PROJECT_ID }}",
                "GPU_MONTHLY_BUDGET": "100.0",
                "GPU_SCALE_UP_THRESHOLD": "70.0",
                "GPU_SCALE_DOWN_THRESHOLD": "20.0",
                "GPU_MAX_INSTANCES": "3",
                "GPU_MIN_INSTANCES": "0"
              }' > env-vars.json
          else
            # NOTE: DATABASE_URL est géré comme secret, pas comme variable
            cat > env-vars.json << EOF
          {
            "CLOUD_RUN": "true",
            "ENABLE_AUTO_MIGRATIONS": "true",
            "SQLX_OFFLINE": "true",
            "HOST": "0.0.0.0",
            "RUST_LOG": "info",
            "APP_ENV": "production",
            "GPU_ENABLED": "true",
            "GPU_ENDPOINT": "http://yukpo-gpu-workers:8080",
            "GPU_ZONE": "europe-west1-b",
            "GPU_INSTANCE_NAME": "yukpo-gpu-worker",
            "GCP_PROJECT_ID": "${{ secrets.GCP_PROJECT_ID }}",
            "GPU_MONTHLY_BUDGET": "100.0",
            "GPU_SCALE_UP_THRESHOLD": "70.0",
            "GPU_SCALE_DOWN_THRESHOLD": "20.0",
            "GPU_MAX_INSTANCES": "3",
            "GPU_MIN_INSTANCES": "0"
          }
          EOF
          fi
          
          # Ajouter toutes les variables avec prefixe GCP_ENV_
          # EXCLURE les variables qui sont gérées comme secrets: DATABASE_URL, REDIS_URL, MONGODB_URL, JWT_SECRET
          SECRET_VARS="DATABASE_URL|REDIS_URL|MONGODB_URL|JWT_SECRET"
          if command -v gh &> /dev/null; then
            gh auth status || gh auth login --with-token <<< "${{ secrets.GITHUB_TOKEN }}"
            for secret in $(gh secret list --repo ${{ github.repository }} --json name -q '.[].name' | grep "^GCP_ENV_"); do
              VAR_NAME=$(echo $secret | sed 's/^GCP_ENV_//')
              # Ignorer les variables qui sont des secrets
              if echo "$VAR_NAME" | grep -qE "^($SECRET_VARS)$"; then
                echo "Skipping $VAR_NAME (managed as secret)"
                continue
              fi
              VAR_VALUE=$(gh secret get $secret --repo ${{ github.repository }} 2>/dev/null || echo "")
              if [ -n "$VAR_VALUE" ]; then
                if command -v jq &> /dev/null; then
                  jq --arg key "$VAR_NAME" --arg val "$VAR_VALUE" '. + {($key): $val}' env-vars.json > env-vars.tmp.json && mv env-vars.tmp.json env-vars.json
                else
                  VAR_VALUE_ESCAPED=$(echo "$VAR_VALUE" | sed 's/\\/\\\\/g' | sed 's/"/\\"/g')
                  sed -i "s/}$/,\"$VAR_NAME\":\"$VAR_VALUE_ESCAPED\"}/" env-vars.json
                fi
              fi
            done
          fi
          
          # ✅ CRITIQUE: Nettoyer env-vars.json pour retirer TOUS les secrets (au cas où ils seraient présents)
          echo "Nettoyage final de env-vars.json (retrait des secrets)..."
          if command -v jq &> /dev/null; then
            jq 'del(.DATABASE_URL, .REDIS_URL, .MONGODB_URL, .JWT_SECRET)' env-vars.json > env-vars-clean.json && mv env-vars-clean.json env-vars.json
            echo "✅ Fichier env-vars.json nettoyé"
          else
            echo "⚠️ jq non disponible, nettoyage manuel impossible"
          fi
          
          # Afficher le contenu final pour debug
          echo "Contenu final de env-vars.json:"
          cat env-vars.json
          
          echo "env_file=env-vars.json" >> $GITHUB_OUTPUT

      - name: Deploy to Cloud Run
        run: |
          # Le nettoyage a déjà été fait dans l'étape précédente
          echo "Déploiement vers Cloud Run..."
          
          # ✅ CRITIQUE: Retirer les secrets des variables d'environnement AVANT de les ajouter comme secrets
          # Note: On utilise maintenant --clear-env-vars dans le déploiement, donc cette étape est moins critique
          # mais on la garde pour être sûr
          echo "Suppression des secrets des variables d'environnement (s'ils existent)..."
          gcloud run services update ${{ env.SERVICE_NAME }} \
            --region ${{ env.REGION }} \
            --remove-env-vars="DATABASE_URL,REDIS_URL,MONGODB_URL,JWT_SECRET" \
            --project ${{ secrets.GCP_PROJECT_ID }} 2>&1 | grep -v "does not exist" || true
          
          # Construire la liste des variables d'environnement depuis env-vars.json (sans les secrets)
          echo "Construction de la liste des variables d'environnement..."
          if command -v jq &> /dev/null; then
            # Extraire toutes les clés sauf les secrets - CRITIQUE: Exclure explicitement tous les secrets
            ENV_VARS=$(jq -r 'to_entries | map(select(.key != "DATABASE_URL" and .key != "REDIS_URL" and .key != "MONGODB_URL" and .key != "JWT_SECRET")) | map("\(.key)=\(.value)") | join(",")' ${{ steps.prepare-env.outputs.env_file }})
            echo "Variables d'environnement à définir: $ENV_VARS"
            
            # Vérifier que les secrets ne sont pas dans ENV_VARS
            if echo "$ENV_VARS" | grep -qE "(DATABASE_URL|REDIS_URL|MONGODB_URL|JWT_SECRET)"; then
              echo "❌ ERREUR: Des secrets sont présents dans ENV_VARS!"
              echo "$ENV_VARS" | grep -E "(DATABASE_URL|REDIS_URL|MONGODB_URL|JWT_SECRET)" || true
              exit 1
            fi
            
            # Déployer avec --set-env-vars au lieu de --env-vars-file pour éviter les conflits
            # IMPORTANT: Utiliser --clear-env-vars d'abord pour supprimer toutes les variables existantes
            # puis --set-env-vars pour définir uniquement les variables non-secrets
            if [ -n "$ENV_VARS" ] && [ "$ENV_VARS" != "null" ]; then
              echo "Déploiement avec variables d'environnement..."
              gcloud run deploy ${{ env.SERVICE_NAME }} \
                --image ${{ env.IMAGE_NAME }}:${{ github.sha }} \
                --platform managed \
                --region ${{ env.REGION }} \
                --allow-unauthenticated \
                --port 8080 \
                --clear-env-vars \
                --set-env-vars="$ENV_VARS" \
                --update-secrets="JWT_SECRET=jwt-secret:latest,DATABASE_URL=database-url:latest,REDIS_URL=redis-url:latest,MONGODB_URL=mongodb-url:latest" \
                --add-cloudsql-instances ${{ secrets.GCP_PROJECT_ID }}:${{ env.REGION }}:yukpo-postgres \
                --memory 2Gi \
                --cpu 2 \
                --timeout 900 \
                --max-instances 10 \
                --cpu-boost \
                --cpu-throttling \
                --service-account ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }} \
                --project ${{ secrets.GCP_PROJECT_ID }}
            else
              # Si aucune variable, déployer sans --set-env-vars mais avec --clear-env-vars
              echo "Déploiement sans variables d'environnement (seulement secrets)..."
              gcloud run deploy ${{ env.SERVICE_NAME }} \
                --image ${{ env.IMAGE_NAME }}:${{ github.sha }} \
                --platform managed \
                --region ${{ env.REGION }} \
                --allow-unauthenticated \
                --port 8080 \
                --clear-env-vars \
                --update-secrets="JWT_SECRET=jwt-secret:latest,DATABASE_URL=database-url:latest,REDIS_URL=redis-url:latest,MONGODB_URL=mongodb-url:latest" \
                --add-cloudsql-instances ${{ secrets.GCP_PROJECT_ID }}:${{ env.REGION }}:yukpo-postgres \
                --memory 2Gi \
                --cpu 2 \
                --timeout 900 \
                --max-instances 10 \
                --cpu-boost \
                --cpu-throttling \
                --service-account ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }} \
                --project ${{ secrets.GCP_PROJECT_ID }}
            fi
          else
            # Fallback: utiliser env-vars-file mais avec nettoyage supplémentaire
            echo "⚠️ jq non disponible, utilisation de env-vars-file avec nettoyage manuel..."
            # Vérifier que le fichier ne contient pas les secrets
            if grep -q "DATABASE_URL\|REDIS_URL\|MONGODB_URL\|JWT_SECRET" ${{ steps.prepare-env.outputs.env_file }}; then
              echo "❌ ERREUR: Le fichier env-vars.json contient encore des secrets!"
              exit 1
            fi
            gcloud run deploy ${{ env.SERVICE_NAME }} \
              --image ${{ env.IMAGE_NAME }}:${{ github.sha }} \
              --platform managed \
              --region ${{ env.REGION }} \
              --allow-unauthenticated \
              --port 8080 \
              --env-vars-file ${{ steps.prepare-env.outputs.env_file }} \
              --update-secrets="JWT_SECRET=jwt-secret:latest,DATABASE_URL=database-url:latest,REDIS_URL=redis-url:latest,MONGODB_URL=mongodb-url:latest" \
              --add-cloudsql-instances ${{ secrets.GCP_PROJECT_ID }}:${{ env.REGION }}:yukpo-postgres \
              --memory 2Gi \
              --cpu 2 \
              --timeout 900 \
              --max-instances 10 \
              --cpu-boost \
              --cpu-throttling \
              --service-account ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }} \
              --project ${{ secrets.GCP_PROJECT_ID }}
          fi

      - name: Get Service URL
        id: service-url
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region ${{ env.REGION }} \
            --format 'value(status.url)' \
            --project ${{ secrets.GCP_PROJECT_ID }})
          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: Deployment summary
        if: always()
        run: |
          echo "## 🚀 GCP Cloud Run Deployment - Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Service**: \`${{ env.SERVICE_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Region**: \`${{ env.REGION }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Image**: \`${{ env.IMAGE_NAME }}:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **URL**: \`${{ steps.service-url.outputs.url }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Déploiement terminé avec succès" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "💡 Les migrations seront exécutées automatiquement au démarrage (ENABLE_AUTO_MIGRATIONS=true)" >> $GITHUB_STEP_SUMMARY

