name: Deploy to Google Cloud Platform

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'backend/**'
      - '.github/workflows/gcp-deploy.yml'
  workflow_dispatch:

env:
  PROJECT_ID: yukpo-project
  SERVICE_NAME: yukpo-backend
  REGION: europe-west1
  ARTIFACT_REGISTRY_REPO: yukpo-backend
  IMAGE_NAME: europe-west1-docker.pkg.dev/yukpo-project/yukpo-backend/yukpo-backend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - id: 'auth'
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: 'google-github-actions/setup-gcloud@v2'
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker europe-west1-docker.pkg.dev
          gcloud auth configure-docker gcr.io

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare Dockerfile
        run: |
          if [ ! -f backend/Dockerfile.cloud.optimized ]; then
            echo "ERROR: backend/Dockerfile.cloud.optimized not found!"
            exit 1
          fi
          sed -E \
            -e '/^COPY --from=/! s#^COPY (Cargo\.toml Cargo\.lock) #COPY backend/Cargo.toml backend/Cargo.lock #' \
            -e '/^COPY --from=/! s#^COPY \.sqlx #COPY backend/.sqlx #' \
            -e '/^COPY --from=/! s#^COPY (src|scripts|ia_prompts|config|migrations|blender) #COPY backend/\1 #' \
            -e '/^COPY --from=/! s#^COPY ([^/ ]+\.md) #COPY backend/\1 #' \
            -e '/^COPY --from=/! s#^COPY scripts/([^ ]+) #COPY backend/scripts/\1 #' \
            backend/Dockerfile.cloud.optimized > Dockerfile.build

      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.build
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          build-args: |
            SQLX_OFFLINE=true
            BUILDKIT_INLINE_CACHE=1

      - name: Prepare Environment Variables
        id: prepare-env
        run: |
          echo "Preparing environment variables from GitHub secrets..."
          
          # Créer un fichier JSON pour les variables d'environnement
          if command -v jq &> /dev/null; then
            echo '{}' | jq \
              --arg db_url "${{ secrets.GCP_DATABASE_URL }}" \
              '. + {
                "DATABASE_URL": $db_url,
                "CLOUD_RUN": "true",
                "ENABLE_AUTO_MIGRATIONS": "true",
                "SQLX_OFFLINE": "true",
                "PORT": "8080",
                "HOST": "0.0.0.0",
                "RUST_LOG": "info",
                "APP_ENV": "production"
              }' > env-vars.json
          else
            DB_URL_ESCAPED=$(echo "${{ secrets.GCP_DATABASE_URL }}" | sed 's/\\/\\\\/g' | sed 's/"/\\"/g')
            cat > env-vars.json << EOF
          {
            "DATABASE_URL": "$DB_URL_ESCAPED",
            "CLOUD_RUN": "true",
            "ENABLE_AUTO_MIGRATIONS": "true",
            "SQLX_OFFLINE": "true",
            "PORT": "8080",
            "HOST": "0.0.0.0",
            "RUST_LOG": "info",
            "APP_ENV": "production"
          }
          EOF
          fi
          
          # Ajouter toutes les variables avec prefixe GCP_ENV_
          if command -v gh &> /dev/null; then
            gh auth status || gh auth login --with-token <<< "${{ secrets.GITHUB_TOKEN }}"
            for secret in $(gh secret list --repo ${{ github.repository }} --json name -q '.[].name' | grep "^GCP_ENV_"); do
              VAR_NAME=$(echo $secret | sed 's/^GCP_ENV_//')
              VAR_VALUE=$(gh secret get $secret --repo ${{ github.repository }} 2>/dev/null || echo "")
              if [ -n "$VAR_VALUE" ]; then
                if command -v jq &> /dev/null; then
                  jq --arg key "$VAR_NAME" --arg val "$VAR_VALUE" '. + {($key): $val}' env-vars.json > env-vars.tmp.json && mv env-vars.tmp.json env-vars.json
                else
                  VAR_VALUE_ESCAPED=$(echo "$VAR_VALUE" | sed 's/\\/\\\\/g' | sed 's/"/\\"/g')
                  sed -i "s/}$/,\"$VAR_NAME\":\"$VAR_VALUE_ESCAPED\"}/" env-vars.json
                fi
              fi
            done
          fi
          
          echo "env_file=env-vars.json" >> $GITHUB_OUTPUT

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --platform managed \
            --region ${{ env.REGION }} \
            --allow-unauthenticated \
            --env-vars-file ${{ steps.prepare-env.outputs.env_file }} \
            --add-cloudsql-instances ${{ secrets.GCP_PROJECT_ID }}:${{ env.REGION }}:yukpo-postgres \
            --memory 1Gi \
            --cpu 2 \
            --timeout 900 \
            --startup-probe=timeoutSeconds=10,periodSeconds=5,httpGet.port=8080,httpGet.path=/health \
            --cpu-throttling \
            --cpu-boost \
            --max-instances 10 \
            --project ${{ secrets.GCP_PROJECT_ID }}

      - name: Get Service URL
        id: service-url
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region ${{ env.REGION }} \
            --format 'value(status.url)' \
            --project ${{ secrets.GCP_PROJECT_ID }})
          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: Deployment summary
        if: always()
        run: |
          echo "## 🚀 GCP Cloud Run Deployment - Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Service**: \`${{ env.SERVICE_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Region**: \`${{ env.REGION }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Image**: \`${{ env.IMAGE_NAME }}:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **URL**: \`${{ steps.service-url.outputs.url }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Déploiement terminé avec succès" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "💡 Les migrations seront exécutées automatiquement au démarrage (ENABLE_AUTO_MIGRATIONS=true)" >> $GITHUB_STEP_SUMMARY

