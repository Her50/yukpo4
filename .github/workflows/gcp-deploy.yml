name: Deploy to Google Cloud Platform

on:
  push:
    branches: [master, main]
    paths:
      - 'backend/**'
      - 'scripts/**'
      - '.github/workflows/gcp-deploy.yml'
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Forcer le déploiement même sans changements backend'
        required: false
        default: false
        type: boolean

env:
  PROJECT_ID:   ${{ secrets.GCP_PROJECT_ID }}
  SERVICE_NAME: yukpo-backend
  REGION:       europe-west1
  IMAGE_NAME:   europe-west1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/yukpo-backend/yukpo-backend
  HEALTH_URL:   https://yukpo-backend-376093909298.europe-west1.run.app/health

concurrency:
  group: gcp-deploy-${{ github.ref }}
  cancel-in-progress: false   # Ne jamais annuler un déploiement en cours

jobs:
  build-and-deploy:
    name: Build → Push → Deploy → Verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # REQUIS pour Workload Identity Federation

    steps:
      # ── 1. Checkout ─────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

      # ── 2. Auth GCP via Workload Identity Federation ─────────
      #   Aucune clé JSON — token OIDC éphémère, rotation automatique
      - name: Authenticate to Google Cloud (WIF)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account:           ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

      # ── 3. Cloud SDK ─────────────────────────────────────────
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      # ── 4. Docker registry ───────────────────────────────────
      - name: Configure Docker → Artifact Registry
        run: gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet

      # ── 5. Buildx ────────────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── 6. Préparer le Dockerfile (ajuster les chemins) ──────
      - name: Prepare Dockerfile
        run: |
          if [ ! -f backend/Dockerfile.cloud.optimized ]; then
            echo "❌ backend/Dockerfile.cloud.optimized introuvable"
            exit 1
          fi
          sed -E \
            -e '/^COPY --from=/! s#^COPY (Cargo\.toml) (Cargo\.lock) #COPY backend/\1 backend/\2 #' \
            -e '/^COPY --from=/! s#^COPY \.sqlx #COPY backend/.sqlx #' \
            -e '/^COPY --from=/! s#^COPY (src|scripts|ia_prompts|config|migrations|blender|public) #COPY backend/\1 #' \
            -e '/^COPY --from=/! s#^COPY scripts/#COPY backend/scripts/#' \
            -e '/^COPY --from=/! s#^COPY ([^/ ]+\.(md|toml|lock)) #COPY backend/\1 #' \
            backend/Dockerfile.cloud.optimized > Dockerfile.build
          # Les générateurs Python sont dans scripts/ racine (pas backend/scripts/) — annuler la sur-transformation
          sed -i 's#COPY backend/scripts/document_generator\.py#COPY scripts/document_generator.py#g' Dockerfile.build
          sed -i 's#COPY backend/scripts/visual_generator\.py#COPY scripts/visual_generator.py#g' Dockerfile.build
          echo "✅ Dockerfile.build généré"
          head -5 Dockerfile.build

      # ── 7. Build & Push ──────────────────────────────────────
      - name: Build and Push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file:    Dockerfile.build
          push:    true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max
          build-args: |
            SQLX_OFFLINE=true
            BUILDKIT_INLINE_CACHE=1

      # ── 8. Vérifier Cloud SQL ────────────────────────────────
      - name: Verify Cloud SQL instance
        run: |
          INSTANCE="yukpo-postgres"
          if ! gcloud sql instances describe "$INSTANCE" \
              --project="$PROJECT_ID" --format="value(state)" 2>/dev/null | grep -q "RUNNABLE"; then
            echo "❌ Instance Cloud SQL '$INSTANCE' absente ou non RUNNABLE"
            gcloud sql instances describe "$INSTANCE" --project="$PROJECT_ID" 2>/dev/null || true
            exit 1
          fi
          echo "✅ Cloud SQL $INSTANCE — RUNNABLE"
          CLOUD_SQL_INSTANCE="${PROJECT_ID}:${REGION}:${INSTANCE}"
          echo "CLOUD_SQL_INSTANCE=$CLOUD_SQL_INSTANCE" >> "$GITHUB_ENV"

      # ── 9. Construire les variables d'env (sans les secrets) ─
      - name: Build environment variables
        id: envvars
        run: |
          # ubuntu-latest a toujours jq — pas besoin de fallback
          ENV_JSON=$(jq -n '{
            CLOUD_RUN:                            "true",
            ENABLE_AUTO_MIGRATIONS:              "true",
            SQLX_OFFLINE:                        "true",
            RUST_LOG:                            "info",
            LOG_FORMAT:                          "json",
            APP_ENV:                             "production",
            ENVIRONMENT:                         "production",
            INSTANCE_ID:                         "backend-1",
            GCP_PROJECT_ID:                      $ENV.GCP_PROJECT_ID,

            DB_POOL_SIZE:                        "30",
            DB_POOL_MIN_SIZE:                    "5",
            DB_ACQUIRE_TIMEOUT_SECS:             "30",
            DB_HEALTH_CHECK_INTERVAL_SECS:       "30",
            DATABASE_TIMEOUT:                    "10",

            API_MAX_PAYLOAD_SIZE:                "10485760",
            API_RATE_LIMIT_PER_MINUTE:           "100",
            REQUEST_TIMEOUT:                     "30",
            RATE_LIMIT_IP:                       "200",

            AI_REQUEST_TIMEOUT_SECONDS:          "120",
            ENABLE_AI_OPTIMIZATIONS:             "true",
            EMBEDDING_MAX_RETRIES:               "3",
            EMBEDDING_TIMEOUT_SECONDS:           "60",

            YUKPO_IA_BILLING_ENABLED:            "true",
            YUKPO_IA_MONTHLY_FREE_TOKEN_BUDGET:  "4000",
            YUKPO_IA_TOKEN_MULTIPLIER:           "1.0",

            GPU_ENABLED:                         "true",
            GPU_ENDPOINT:                        "http://34.78.117.187:8080",
            GPU_ZONE:                            "europe-west1-b",
            GPU_INSTANCE_NAME:                   "yukpo-gpu-worker",
            GPU_MONTHLY_BUDGET:                  "100.0",
            GPU_SCALE_UP_THRESHOLD:              "70.0",
            GPU_SCALE_DOWN_THRESHOLD:            "20.0",
            GPU_MAX_INSTANCES:                   "2",
            GPU_MIN_INSTANCES:                   "0",
            GPU_SCALE_DOWN_COOLDOWN:             "300",
            GPU_REQUEST_TIMEOUT:                 "60",

            LIVEKIT_VM_AUTOSCALE:                "true",
            LIVEKIT_VM_INSTANCE_NAME:            "yukpo-livekit-server",
            LIVEKIT_VM_COOLDOWN_SECS:            "600",
            LIVEKIT_VM_CHECK_INTERVAL_SECS:      "120",
            REDIS_SCALING_ENABLED:               "false",

            VIDEO_GENERATION_TIMEOUT_SECONDS:    "600",
            VIDEO_ANALYSIS_TIMEOUT_SECONDS:      "180",
            VIDEO_RENDERER_ENABLE_GPU:           "true",
            VIDEO_RENDERER_MAX_RETRIES:          "2",
            VIDEO_RENDERER_TIMEOUT_SECS:         "900",
            VIDEO_RENDERER_RPC_URL:              "http://34.78.117.187:8080/render",
            AUDIO_SYNC_TIMEOUT_SECONDS:          "180",
            MAX_VIDEO_SIZE_MB:                   "50",
            MAX_AUDIO_SIZE_MB:                   "10",
            MAX_IMAGE_SIZE_MB:                   "10",
            MAX_DOC_SIZE_MB:                     "10",
            MAX_EXCEL_SIZE_MB:                   "5",

            SORA_API_URL:                        "https://api.openai.com/v1/video/generations",

            UPLOAD_BASE_URL:    "https://storage.googleapis.com/yukpo-project-yukpo-backend-media",
            PUBLIC_BASE_URL:    "https://storage.googleapis.com/yukpo-project-yukpo-backend-media",
            SHARE_BASE_URL:     "https://yukpo-backend-376093909298.europe-west1.run.app",
            UPLOAD_STORAGE_PATH: "uploads",
            S3_BUCKET:          "yukpo-project-yukpo-backend-media",
            S3_REGION:          "europe-west1",
            S3_ENDPOINT:        "https://storage.googleapis.com",
            S3_FORCE_PATH_STYLE: "false",
            RENDERER_S3_UPLOAD:  "true",

            LIVEKIT_INGRESS_MODE:    "rtmp",
            LIVEKIT_INGRESS_NAME:    "prod-ingress-1",
            LIVEKIT_INGRESS_REGION:  "europe-west1",
            LIVEKIT_INGRESS_ROOM:    "live-events",
            LIVEKIT_API_URL:         "http://35.195.101.90:7880",
            LIVEKIT_WS_URL:          "ws://35.195.101.90:7880",
            LIVE_FALLBACK_ENABLED:   "true",
            LIVE_RECORDING_ENABLED:  "true",
            FEATURE_FLAG_CONNECTORS_LIVEKIT: "true",

            APP_DOMAIN:          "yukpo.com",
            API_BASE_URL:        "https://yukpo-backend-376093909298.europe-west1.run.app",
            BACKEND_URL:         "https://yukpo-backend-376093909298.europe-west1.run.app",
            WEBHOOK_BASE_URL:    "https://yukpo-backend-376093909298.europe-west1.run.app",
            FRONTEND_URL:        "https://yukpo.com",
            PAYMENT_PRIMARY_PROVIDER: "cinetpay",

            EMAIL_ENABLED:       "true",
            EMAIL_PROVIDER:      "sendgrid",
            SENDGRID_FROM_EMAIL: "noreply@yukpo.com",
            SENDGRID_FROM_NAME:  "Yukpo",
            SMS_ENABLED:         "true",
            SMS_PROVIDER:        "twilio",

            SEARCH_DEFAULT_LANGUAGE:  "fr",
            SEARCH_DEFAULT_RADIUS_KM: "20",
            SEARCH_MAX_RESULTS:       "50",
            SEARCH_TITLE_BOOST:       "2.0",
            SEMANTIC_CACHE_THRESHOLD: "0.85",
            CACHE_DEFAULT_TTL:        "3600",
            CACHE_TTL_SEARCH:         "600",

            DELIVERY_MATCHING_WORKER_BATCH_SIZE:     "50",
            DELIVERY_MATCHING_WORKER_INTERVAL_SECS:  "30",
            DELIVERY_MATCHING_WORKER_PARALLEL:       "3",
            DELIVERY_PENDING_TIMEOUT_MINUTES:        "60",
            DELIVERY_TIMEOUT_MONITOR_INTERVAL_SECS:  "60",
            MATCHING_MIN_SCORE_THRESHOLD:            "0.6",

            SLA_PROMISED_MINUTES:        "30",
            SLA_THRESHOLD_RATIO:         "1.10",
            SLA_LOOKBACK_MINUTES:        "60",
            SLA_MONITOR_INTERVAL_SECONDS: "300",

            GLOBAL_PROMO_SCHEDULER_INTERVAL_SECS: "30",
            JWT_EXPIRATION_HOURS:  "24",
            KYC_PROVIDER:          "manual",
            ML_MODELS_DIR:         "models",
            YUKPO_IMMO_COMMISSION_RATE: "0.05",

            GOOGLE_CLIENT_ID: "738929393617-4kt4e9ed1g79j70dng7epskqn7rkqnm2.apps.googleusercontent.com",
            CORS_ALLOWED_ORIGINS: "https://yukpo.com,https://yukpo-backend-376093909298.europe-west1.run.app",

            YOUTUBE_API_KEY:       $ENV.YOUTUBE_API_KEY,
            NEWSAPI_KEY:           $ENV.NEWSAPI_KEY,
            TWITTER_BEARER_TOKEN:  $ENV.TWITTER_BEARER_TOKEN,
            SERPAPI_KEY:           $ENV.SERPAPI_KEY,

            WHATSAPP_REDIRECT_URI: "https://yukpo-backend-376093909298.europe-west1.run.app/api/social/whatsapp/callback",
            INSTAGRAM_REDIRECT_URI: "https://yukpo-backend-376093909298.europe-west1.run.app/api/social/instagram/callback",

            DB_ACQUIRE_TIMEOUT_SECS:             "45"
          }' --arg GCP_PROJECT_ID "$PROJECT_ID" \
             --arg YOUTUBE_API_KEY "${{ secrets.YOUTUBE_API_KEY }}" \
             --arg NEWSAPI_KEY "${{ secrets.NEWSAPI_KEY }}" \
             --arg TWITTER_BEARER_TOKEN "${{ secrets.TWITTER_BEARER_TOKEN }}" \
             --arg SERPAPI_KEY "${{ secrets.SERPAPI_KEY }}" \
             --args)

          # Convertir JSON → "KEY=VALUE;KEY2=VALUE2" (séparateur ; pour gcloud)
          ENV_VARS=$(echo "$ENV_JSON" | jq -r 'to_entries | map("\(.key)=\(.value)") | join(";")')
          echo "✅ $(echo "$ENV_JSON" | jq 'keys | length') variables d'environnement préparées"

          # Écrire dans GITHUB_OUTPUT (multiline safe)
          {
            echo "env_vars<<ENVEOF"
            echo "$ENV_VARS"
            echo "ENVEOF"
          } >> "$GITHUB_OUTPUT"

      # ── 10. Déploiement Cloud Run (no-traffic d'abord) ───────
      - name: Deploy to Cloud Run
        id: deploy
        run: |
          echo "🚀 Déploiement de la révision ${{ github.sha }}..."

          # Probe : 0s init + 10 tentatives × 10s = 100s max pour le binding TCP
          STARTUP_PROBE="timeoutSeconds=3,periodSeconds=10,initialDelaySeconds=0,failureThreshold=60,tcpSocket.port=8080"

          # Secrets gérés par Secret Manager (jamais en clair dans les env vars)
          SECRETS="JWT_SECRET=jwt-secret:latest,DATABASE_URL=database-url:latest,REDIS_URL=redis-url:latest,FACEBOOK_APP_ID=meta-app-id:latest,FACEBOOK_APP_SECRET=meta-app-secret:latest,INSTAGRAM_APP_ID=meta-app-id:latest,INSTAGRAM_APP_SECRET=meta-app-secret:latest,META_APP_ID=meta-app-id:latest,META_APP_SECRET=meta-app-secret:latest,META_ACCESS_TOKEN=meta-access-token:latest,WHATSAPP_ACCESS_TOKEN=meta-access-token:latest,INSTAGRAM_MONITOR_TOKEN=meta-access-token:latest,META_WEBHOOK_VERIFY_TOKEN=meta-webhook-verify-token:latest,WHATSAPP_PHONE_NUMBER_ID=whatsapp-phone-number-id:latest,WHATSAPP_BUSINESS_ACCOUNT_ID=whatsapp-business-account-id:latest,TWILIO_WHATSAPP_NUMBER=twilio-whatsapp-number:latest,FACEBOOK_REDIRECT_URI=FACEBOOK_REDIRECT_URI:latest"

          # ✅ Retirer les anciennes liaisons secrets pour YOUTUBE_API_KEY/NEWSAPI_KEY/SERPAPI_KEY
          # (elles étaient liées comme secrets Cloud Run, on les passe maintenant en env vars)
          gcloud run services update "$SERVICE_NAME" \
            --region "$REGION" \
            --remove-secrets="YOUTUBE_API_KEY,NEWSAPI_KEY,SERPAPI_KEY" \
            --quiet 2>/dev/null || true

          gcloud run deploy "$SERVICE_NAME" \
            --image "${{ env.IMAGE_NAME }}:${{ github.sha }}" \
            --platform managed \
            --region "$REGION" \
            --allow-unauthenticated \
            --port 8080 \
            --startup-probe="$STARTUP_PROBE" \
            --no-traffic \
            --update-env-vars="^;^${{ steps.envvars.outputs.env_vars }}" \
            --remove-env-vars="DATABASE_URL,REDIS_URL,JWT_SECRET" \
            --update-secrets="$SECRETS" \
            --set-cloudsql-instances="$CLOUD_SQL_INSTANCE" \
            --memory 4Gi \
            --cpu 2 \
            --timeout 900 \
            --min-instances 1 \
            --max-instances 10 \
            --cpu-boost \
            --cpu-throttling \
            --service-account "${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}" \
            --project "$PROJECT_ID" \
            --tag "sha-${{ steps.sha.outputs.short }}" \
            --quiet

          # Récupérer l'URL de la révision taggée pour le health check
          TAGGED_URL=$(gcloud run services describe "$SERVICE_NAME" \
            --region "$REGION" \
            --project "$PROJECT_ID" \
            --format "value(status.traffic[?tag='sha-${{ steps.sha.outputs.short }}'].url)" 2>/dev/null || echo "")

          if [ -z "$TAGGED_URL" ]; then
            # Fallback : URL de base du service (le step health check ajoute /health)
            TAGGED_URL="https://yukpo-backend-376093909298.europe-west1.run.app"
          fi

          echo "tagged_url=$TAGGED_URL" >> "$GITHUB_OUTPUT"
          echo "✅ Révision déployée (sans trafic) — URL: $TAGGED_URL"

      # ── 11. Health check sur la nouvelle révision ─────────────
      - name: Health check (nouvelle révision)
        id: healthcheck
        run: |
          URL="${{ steps.deploy.outputs.tagged_url }}/health"
          echo "🏥 Health check → $URL"
          MAX=12   # 12 tentatives × 10s = 2 min
          for i in $(seq 1 $MAX); do
            HTTP=$(curl -s -o /tmp/health_body.txt -w "%{http_code}" \
                   --max-time 10 --retry 0 "$URL" 2>/dev/null || echo "000")
            BODY=$(cat /tmp/health_body.txt 2>/dev/null || echo "")
            echo "  Tentative $i/$MAX — HTTP $HTTP — $BODY"
            if [ "$HTTP" = "200" ]; then
              echo "✅ Service en bonne santé"
              echo "status=ok" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            [ "$i" -lt "$MAX" ] && sleep 10
          done
          echo "❌ Health check échoué après $MAX tentatives"
          echo "status=failed" >> "$GITHUB_OUTPUT"
          exit 1

      # ── 12. Basculer 100% du trafic vers la nouvelle révision ─
      - name: Migrate traffic to new revision
        run: |
          echo "🔀 Bascule du trafic vers sha-${{ steps.sha.outputs.short }}..."
          gcloud run services update-traffic "$SERVICE_NAME" \
            --region "$REGION" \
            --project "$PROJECT_ID" \
            --to-tags "sha-${{ steps.sha.outputs.short }}=100" \
            --quiet
          echo "✅ 100% du trafic sur la nouvelle révision"

      # ── 13. Rollback automatique si health check échoué ──────
      - name: Rollback on failure
        if: failure() && steps.healthcheck.outputs.status == 'failed'
        run: |
          echo "⚠️  Health check échoué — rollback vers la révision précédente..."
          PREV=$(gcloud run revisions list \
            --service="$SERVICE_NAME" \
            --region="$REGION" \
            --project="$PROJECT_ID" \
            --format="value(metadata.name)" \
            --sort-by="~metadata.creationTimestamp" \
            --limit=2 | tail -1)
          if [ -n "$PREV" ]; then
            gcloud run services update-traffic "$SERVICE_NAME" \
              --region "$REGION" \
              --project "$PROJECT_ID" \
              --to-revisions "$PREV=100" \
              --quiet
            echo "✅ Rollback effectué vers $PREV"
          else
            echo "❌ Impossible de trouver la révision précédente"
          fi

      # ── 14. Nettoyage des anciennes révisions ────────────────
      - name: Cleanup old revisions (keep last 5)
        if: success()
        run: |
          echo "🧹 Nettoyage des anciennes révisions (garde les 5 dernières)..."
          OLD=$(gcloud run revisions list \
            --service="$SERVICE_NAME" \
            --region="$REGION" \
            --project="$PROJECT_ID" \
            --format="value(metadata.name)" \
            --sort-by="~metadata.creationTimestamp" | tail -n +6)
          if [ -n "$OLD" ]; then
            echo "$OLD" | xargs -P 4 -I {} \
              gcloud run revisions delete {} \
                --region="$REGION" \
                --project="$PROJECT_ID" \
                --quiet 2>/dev/null || true
            echo "✅ Anciennes révisions supprimées"
          else
            echo "ℹ️  Aucune révision à supprimer"
          fi

      # ── 15. Résumé du déploiement ────────────────────────────
      - name: Deployment summary
        if: always()
        run: |
          STATUS="${{ job.status }}"
          ICON="✅"
          [ "$STATUS" != "success" ] && ICON="❌"

          SERVICE_URL=$(gcloud run services describe "$SERVICE_NAME" \
            --region "$REGION" \
            --format "value(status.url)" \
            --project "$PROJECT_ID" 2>/dev/null || echo "N/A")

          {
            echo "## $ICON Déploiement GCP Cloud Run"
            echo ""
            echo "| Champ | Valeur |"
            echo "|---|---|"
            echo "| Service | \`$SERVICE_NAME\` |"
            echo "| Région | \`$REGION\` |"
            echo "| SHA | \`${{ github.sha }}\` |"
            echo "| Statut | **$STATUS** |"
            echo "| URL | $SERVICE_URL |"
            echo ""
            if [ "$STATUS" = "success" ]; then
              echo "✅ Déploiement sans coupure de trafic (blue/green)"
              echo "✅ Health check validé avant bascule"
              echo "✅ Migrations automatiques au démarrage (ENABLE_AUTO_MIGRATIONS=true)"
            else
              echo "⚠️ Rollback automatique déclenché si health check échoué"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
