name: Deploy to Fly.io (backend Yukpo)

# Trigger UNIQUEMENT sur la branche fly-deploy → ne touche pas au workflow GCP.
# Build + push + deploy sont délégués à `flyctl deploy --local-only` :
# - flyctl construit l'image Docker localement sur le runner GH (16 GB RAM, vs ~6 GB Fly remote)
# - flyctl pousse l'image dans le registry Fly avec son propre auth (pas de docker login custom)
# - flyctl déploie immédiatement sans rebuild
#
# Cela évite les problèmes auth registry / cache GHA / docker buildx-action constatés.
on:
  push:
    branches: [fly-deploy]
    paths:
      - 'backend/**'
      - '.github/workflows/fly-deploy.yml'
  workflow_dispatch:

env:
  FLY_APP: yukpo-fly-backend
  FLY_REGION: cdg

concurrency:
  group: fly-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: flyctl deploy --local-only (build sur runner GH 16 GB RAM)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Verify Fly auth
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl auth whoami

      - name: Free runner disk space (avoid 'no space left' during big Rust build)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /opt/microsoft || true
          sudo apt-get clean
          docker system prune -af 2>/dev/null || true
          df -h

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Deploy to Fly (build local sur runner + push + deploy)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        working-directory: backend
        run: |
          flyctl deploy \
            --app "$FLY_APP" \
            --local-only \
            --dockerfile Dockerfile.fly \
            --strategy rolling \
            --wait-timeout 900 \
            --verbose

      - name: Smoke test health endpoint
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          sleep 15
          HEALTH_URL="https://${FLY_APP}.fly.dev/health"
          echo "Testing $HEALTH_URL"
          for i in 1 2 3 4 5 6; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "$HEALTH_URL" || echo 000)
            if [[ "$CODE" == "200" ]]; then
              echo "Health check OK (attempt $i, HTTP $CODE)"
              exit 0
            fi
            echo "Attempt $i: HTTP $CODE — retrying in 15s..."
            sleep 15
          done
          echo "Health check failed after 6 attempts"
          flyctl logs --app "$FLY_APP" --no-tail | tail -80
          exit 1

      - name: Show app status
        if: always()
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl status --app "$FLY_APP" || true
          flyctl machine list --app "$FLY_APP" || true
