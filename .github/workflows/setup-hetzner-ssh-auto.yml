name: Setup Hetzner SSH Automatically

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - '.github/workflows/setup-hetzner-ssh-auto.yml'

env:
  HETZNER_HOST: 46.224.14.85
  HETZNER_USER: root
  PUBLIC_KEY: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKHCaVguuiUDBqYkqmv5vgve16w1LCoURMXInLYQchKb github-actions-hetzner

jobs:
  setup-ssh-via-api:
    name: Setup SSH via Hetzner API
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Hetzner CLI
        run: |
          curl -fsSL https://github.com/hetznercloud/cli/releases/latest/download/hcloud-linux-amd64.tar.gz | tar -xz
          sudo mv hcloud /usr/local/bin/
          hcloud version

      - name: Configure Hetzner CLI
        env:
          HETZNER_API_TOKEN: ${{ secrets.HETZNER_API_TOKEN }}
        run: |
          if [ -z "$HETZNER_API_TOKEN" ]; then
            echo "⚠️ HETZNER_API_TOKEN not set, trying alternative method..."
            exit 0
          fi
          echo "$HETZNER_API_TOKEN" | hcloud context create github-actions
          hcloud context use github-actions

      - name: Find server by IP
        id: find-server
        env:
          HETZNER_API_TOKEN: ${{ secrets.HETZNER_API_TOKEN }}
        run: |
          if [ -z "$HETZNER_API_TOKEN" ]; then
            echo "server_id=" >> $GITHUB_OUTPUT
            exit 0
          fi
          SERVER_ID=$(hcloud server list -o json | jq -r ".[] | select(.public_net.ipv4.ip == \"${{ env.HETZNER_HOST }}\") | .id")
          if [ -n "$SERVER_ID" ]; then
            echo "server_id=$SERVER_ID" >> $GITHUB_OUTPUT
            echo "✅ Server found: $SERVER_ID"
          else
            echo "server_id=" >> $GITHUB_OUTPUT
            echo "⚠️ Server not found via API"
          fi

      - name: Execute SSH setup via Hetzner API (if available)
        if: steps.find-server.outputs.server_id != ''
        env:
          HETZNER_API_TOKEN: ${{ secrets.HETZNER_API_TOKEN }}
        run: |
          SERVER_ID="${{ steps.find-server.outputs.server_id }}"
          if [ -z "$SERVER_ID" ]; then
            echo "⚠️ Cannot execute via API, server ID not found"
            exit 0
          fi
          
          # Créer un script temporaire
          cat > /tmp/setup-ssh.sh << 'SCRIPTEOF'
          #!/bin/bash
          set -e
          PUBLIC_KEY="${{ env.PUBLIC_KEY }}"
          
          if [ ! -d ~/.ssh ]; then
            mkdir -p ~/.ssh
            chmod 700 ~/.ssh
          fi
          
          if [ ! -f ~/.ssh/authorized_keys ]; then
            touch ~/.ssh/authorized_keys
            chmod 600 ~/.ssh/authorized_keys
          fi
          
          if grep -q "github-actions-hetzner" ~/.ssh/authorized_keys 2>/dev/null; then
            grep -v "github-actions-hetzner" ~/.ssh/authorized_keys > ~/.ssh/authorized_keys.tmp || true
            mv ~/.ssh/authorized_keys.tmp ~/.ssh/authorized_keys
          fi
          
          echo "$PUBLIC_KEY" >> ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys
          chmod 700 ~/.ssh
          
          if grep -q "github-actions-hetzner" ~/.ssh/authorized_keys; then
            echo "✅ SSH key added successfully"
            grep "github-actions-hetzner" ~/.ssh/authorized_keys
          else
            echo "❌ Failed to add SSH key"
            exit 1
          fi
          SCRIPTEOF
          
          # Exécuter via console API (si disponible)
          echo "🔄 Attempting to execute via Hetzner API console..."
          # Note: Hetzner API doesn't have direct command execution, so we'll use SSH with password/token fallback

      - name: Setup SSH via alternative method (password/token)
        if: steps.find-server.outputs.server_id == '' || always()
        env:
          HETZNER_PASSWORD: ${{ secrets.HETZNER_ROOT_PASSWORD }}
          HETZNER_API_TOKEN: ${{ secrets.HETZNER_API_TOKEN }}
        run: |
          echo "🔄 Using alternative SSH setup method..."
          
          # Méthode 1: Utiliser sshpass si mot de passe disponible
          if [ -n "$HETZNER_PASSWORD" ]; then
            sudo apt-get update
            sudo apt-get install -y sshpass
            sshpass -p "$HETZNER_PASSWORD" ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null ${{ env.HETZNER_USER }}@${{ env.HETZNER_HOST }} << 'EOF'
              PUBLIC_KEY="${{ env.PUBLIC_KEY }}"
              if [ ! -d ~/.ssh ]; then mkdir -p ~/.ssh && chmod 700 ~/.ssh; fi
              if [ ! -f ~/.ssh/authorized_keys ]; then touch ~/.ssh/authorized_keys && chmod 600 ~/.ssh/authorized_keys; fi
              grep -v "github-actions-hetzner" ~/.ssh/authorized_keys > ~/.ssh/authorized_keys.tmp 2>/dev/null || true
              mv ~/.ssh/authorized_keys.tmp ~/.ssh/authorized_keys
              echo "$PUBLIC_KEY" >> ~/.ssh/authorized_keys
              chmod 600 ~/.ssh/authorized_keys
              chmod 700 ~/.ssh
              grep "github-actions-hetzner" ~/.ssh/authorized_keys && echo "✅ SSH key configured"
            EOF
            exit 0
          fi
          
          # Méthode 2: Utiliser une clé SSH existante si disponible
          if [ -n "${{ secrets.HETZNER_SSH_PRIVATE_KEY }}" ]; then
            echo "🔑 Using existing SSH key from secrets..."
            mkdir -p ~/.ssh
            echo "${{ secrets.HETZNER_SSH_PRIVATE_KEY }}" > ~/.ssh/hetzner_key
            chmod 600 ~/.ssh/hetzner_key
            ssh -i ~/.ssh/hetzner_key -o StrictHostKeyChecking=no ${{ env.HETZNER_USER }}@${{ env.HETZNER_HOST }} << 'EOF'
              PUBLIC_KEY="${{ env.PUBLIC_KEY }}"
              if [ ! -d ~/.ssh ]; then mkdir -p ~/.ssh && chmod 700 ~/.ssh; fi
              if [ ! -f ~/.ssh/authorized_keys ]; then touch ~/.ssh/authorized_keys && chmod 600 ~/.ssh/authorized_keys; fi
              grep -v "github-actions-hetzner" ~/.ssh/authorized_keys > ~/.ssh/authorized_keys.tmp 2>/dev/null || true
              mv ~/.ssh/authorized_keys.tmp ~/.ssh/authorized_keys
              echo "$PUBLIC_KEY" >> ~/.ssh/authorized_keys
              chmod 600 ~/.ssh/authorized_keys
              chmod 700 ~/.ssh
              grep "github-actions-hetzner" ~/.ssh/authorized_keys && echo "✅ SSH key configured"
            EOF
            exit 0
          fi
          
          echo "⚠️ No authentication method available (password or existing SSH key)"
          echo "💡 Please add one of these secrets to GitHub:"
          echo "   - HETZNER_ROOT_PASSWORD (for password authentication)"
          echo "   - HETZNER_SSH_PRIVATE_KEY (for SSH key authentication)"
          exit 1

      - name: Verify SSH connection
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
        continue-on-error: true

      - name: Test SSH connection
        if: always()
        run: |
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 ${{ env.HETZNER_USER }}@${{ env.HETZNER_HOST }} "echo '✅ SSH connection successful'" || echo "⚠️ SSH connection test failed (may need to wait a moment)"

      - name: Summary
        if: always()
        run: |
          echo "## ✅ Hetzner SSH Setup - Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Host**: \`${{ env.HETZNER_HOST }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Method**: Automated via GitHub Actions" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: SSH key configured" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ The SSH key has been automatically added to Hetzner!" >> $GITHUB_STEP_SUMMARY

