name: Docker Build Optimized

on:
  push:
    branches:
      - main
      - master
      - develop
    paths:
      - 'backend/**'
      - '.github/workflows/docker-build-optimized.yml'
  pull_request:
    branches:
      - main
      - master
      - develop
    paths:
      - 'backend/**'
  workflow_dispatch:
    inputs:
      push_to_registry:
        description: 'Push to registry'
        required: false
        default: 'false'
        type: boolean
      push_to_aws:
        description: 'Push to AWS ECR'
        required: false
        default: 'false'
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/yukpomnang-backend-optimized
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: 846505724644
  ECR_REPO_NAME: yukpomnang-backend
  ECR_REPO_URI: 846505724644.dkr.ecr.us-east-1.amazonaws.com/yukpomnang-backend
  SSM_DATABASE_URL_PATH: /yukpomnang/production/DATABASE_URL

jobs:
  run-migrations:
    name: Run Database Migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) || (github.event_name == 'workflow_dispatch' && inputs.push_to_aws == 'true')
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Cache Python dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('scripts/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python dependencies
        run: |
          pip install --cache-dir ~/.cache/pip -r scripts/requirements.txt

      - name: Install PostgreSQL client (for migration corrections)
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          psql --version

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
          override: true

      - name: Cache Rust dependencies
        id: cache-rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.cargo/.package-cache
          key: ${{ runner.os }}-sqlx-cli-v0.8.6-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-sqlx-cli-v0.8.6-
            ${{ runner.os }}-sqlx-cli-
            ${{ runner.os }}-cargo-

      - name: Check cache status
        run: |
          if [ "${{ steps.cache-rust.outputs.cache-hit }}" == "true" ]; then
            echo "✅ Cache Rust restauré avec succès"
            if command -v sqlx &> /dev/null; then
              echo "✅ sqlx-cli trouvé dans le cache"
            else
              echo "⚠️ Cache restauré mais sqlx-cli non trouvé"
            fi
          else
            echo "ℹ️ Cache Rust non trouvé, installation complète nécessaire"
          fi

      - name: Install sqlx-cli
        run: |
          if command -v sqlx &> /dev/null; then
            echo "✅ sqlx-cli trouvé dans le cache"
            sqlx --version
          else
            echo "📦 Installation de sqlx-cli..."
            echo "⏳ Cela peut prendre 5-10 minutes la première fois..."
            echo "💡 Les prochains runs utiliseront le cache (~30s)"
            # Utiliser --locked pour une installation plus rapide et reproductible
            cargo install sqlx-cli --version 0.8.6 --no-default-features --features postgres --locked
            echo "✅ sqlx-cli installé avec succès"
            sqlx --version
          fi

      - name: Run migrations
        env:
          SSM_DATABASE_URL_PATH: ${{ env.SSM_DATABASE_URL_PATH }}
          AWS_REGION: ${{ env.AWS_REGION }}
          FAIL_ON_MIGRATION_ERROR: false  # Ne pas bloquer le build si migrations échouent (VPC privé)
        run: |
          python3 scripts/run_migrations_aws.py || echo "⚠️ Migrations non exécutées (seront exécutées au démarrage ECS)"

      - name: Migration summary
        if: always()
        run: |
          echo "## 🔄 Database Migrations - Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" == "success" ]; then
            echo "- **Status**: ✅ Migrations vérifiées et appliquées avec succès" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ job.status }}" == "failure" ]; then
            echo "- **Status**: ⚠️ Migrations non exécutées (connexion impossible depuis GitHub Actions)" >> $GITHUB_STEP_SUMMARY
            echo "- **Note**: Les migrations seront exécutées automatiquement au démarrage de l'application ECS" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Status**: Migrations vérifiées et appliquées si nécessaire" >> $GITHUB_STEP_SUMMARY
          fi
          echo "- **SSM Parameter**: \`${{ env.SSM_DATABASE_URL_PATH }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Region**: \`${{ env.AWS_REGION }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Fail on Error**: \`false\` (le build continue même si les migrations échouent)" >> $GITHUB_STEP_SUMMARY
          echo "- **Cache**: sqlx-cli et dépendances Python sont mis en cache pour accélérer les prochains runs" >> $GITHUB_STEP_SUMMARY

  build-and-push:
    name: Build and Push Optimized Docker Image
    needs: run-migrations
    if: always() && (needs.run-migrations.result == 'success' || needs.run-migrations.result == 'skipped' || needs.run-migrations.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 60  # Timeout après 60 minutes
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx (with cache)
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:latest
            network=host

      - name: Restore Docker layer cache
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.push_to_registry == 'true')
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure AWS credentials for ECR (build job)
        if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) || (github.event_name == 'workflow_dispatch' && inputs.push_to_aws == 'true')
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to AWS ECR
        if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) || (github.event_name == 'workflow_dispatch' && inputs.push_to_aws == 'true')
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registries: ${{ env.AWS_ACCOUNT_ID }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            ${{ env.ECR_REPO_URI }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=optimized

      - name: Prepare Dockerfile with root context
        run: |
          echo "=== Preparing Dockerfile for root context ==="
          # S'assurer que le fichier source existe
          if [ ! -f backend/Dockerfile.cloud.optimized ]; then
            echo "❌ ERROR: backend/Dockerfile.cloud.optimized not found!"
            exit 1
          fi
          # Créer un Dockerfile à la racine qui ajuste les chemins COPY
          # Le contexte sera la racine, donc on doit préfixer les chemins avec backend/
          # Mais seulement les COPY qui ne viennent pas de --from=builder
          sed -E \
            -e '/^COPY --from=/! s#^COPY (Cargo\.toml Cargo\.lock) #COPY backend/Cargo.toml backend/Cargo.lock #' \
            -e '/^COPY --from=/! s#^COPY \.sqlx #COPY backend/.sqlx #' \
            -e '/^COPY --from=/! s#^COPY (src|scripts|ia_prompts|config|migrations|blender) #COPY backend/\1 #' \
            -e '/^COPY --from=/! s#^COPY ([^/ ]+\.md) #COPY backend/\1 #' \
            -e '/^COPY --from=/! s#^COPY scripts/([^ ]+) #COPY backend/scripts/\1 #' \
            backend/Dockerfile.cloud.optimized > Dockerfile.build
          echo "✅ Dockerfile.build created at root with adjusted paths"
          ls -la Dockerfile.build
          echo "First 10 lines:"
          head -10 Dockerfile.build

      - name: Build and push Docker image (optimized with cache)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.build
          push: ${{ github.event_name != 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.push_to_registry == 'true') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha
            type=local,src=/tmp/.buildx-cache
          cache-to: |
            type=gha,mode=max
            type=local,dest=/tmp/.buildx-cache,mode=max
          platforms: linux/amd64
          build-args: |
            SQLX_OFFLINE=true
            BUILDKIT_INLINE_CACHE=1
          # Optimisations pour accélérer le build
          outputs: type=docker,dest=/tmp/image.tar

      - name: Save build time
        if: always()
        id: build-time
        run: |
          echo "started_at=$(date -u +%s)" >> $GITHUB_OUTPUT

      - name: Image size report
        if: always()
        run: |
          echo "## 📦 Image Size Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|------|" >> $GITHUB_STEP_SUMMARY
          docker images --format "table {{.Repository}}\t{{.Tag}}\t{{.Size}}" | grep -E "(${{ env.IMAGE_NAME }}|${{ env.ECR_REPO_NAME }})" | \
            awk '{print "| " $1 ":" $2 " | " $3 " |"}' >> $GITHUB_STEP_SUMMARY || echo "| N/A | Build failed |" >> $GITHUB_STEP_SUMMARY

      - name: Summary
        if: always()
        run: |
          echo "## ✅ Docker Build Optimized - Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Dockerfile**: \`Dockerfile.cloud.optimized\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Target size**: ~300-400MB (vs 2.4GB standard)" >> $GITHUB_STEP_SUMMARY
          echo "- **Base image**: \`debian:trixie-slim\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Features**: Optimized, no Blender, minimal dependencies" >> $GITHUB_STEP_SUMMARY
          echo "- **Cache**: GitHub Actions cache + local cache pour builds rapides" >> $GITHUB_STEP_SUMMARY
          if [ "${{ github.event_name }}" == "push" ] && ( [ "${{ github.ref }}" == "refs/heads/main" ] || [ "${{ github.ref }}" == "refs/heads/master" ] ); then
            echo "- **AWS ECR**: Image automatiquement poussée vers ECR" >> $GITHUB_STEP_SUMMARY
          fi

  push-to-aws:
    name: Push to AWS ECR
    needs: build-and-push
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) || (github.event_name == 'workflow_dispatch' && inputs.push_to_aws == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to AWS ECR
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registries: ${{ env.AWS_ACCOUNT_ID }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata for ECR
        id: meta-ecr
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.ECR_REPO_URI }}
          tags: |
            type=sha,prefix={{branch}}-
            type=raw,value=latest
            type=raw,value=optimized
            type=ref,event=branch

      - name: Prepare Dockerfile for ECR build
        run: |
          if [ ! -f backend/Dockerfile.cloud.optimized ]; then
            echo "❌ ERROR: backend/Dockerfile.cloud.optimized not found!"
            exit 1
          fi
          # Créer un Dockerfile à la racine qui ajuste les chemins COPY
          sed -E \
            -e '/^COPY --from=/! s#^COPY (Cargo\.toml Cargo\.lock) #COPY backend/Cargo.toml backend/Cargo.lock #' \
            -e '/^COPY --from=/! s#^COPY \.sqlx #COPY backend/.sqlx #' \
            -e '/^COPY --from=/! s#^COPY (src|scripts|ia_prompts|config|migrations|blender) #COPY backend/\1 #' \
            -e '/^COPY --from=/! s#^COPY ([^/ ]+\.md) #COPY backend/\1 #' \
            -e '/^COPY --from=/! s#^COPY scripts/([^ ]+) #COPY backend/scripts/\1 #' \
            backend/Dockerfile.cloud.optimized > Dockerfile.build
          echo "✅ Dockerfile.build created for ECR build"
          test -f Dockerfile.build && echo "✅ Dockerfile.build exists" || echo "❌ Dockerfile.build NOT FOUND"

      - name: Build and push to ECR (from cache)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.build
          push: true
          tags: ${{ steps.meta-ecr.outputs.tags }}
          labels: ${{ steps.meta-ecr.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          build-args: |
            SQLX_OFFLINE=true
            BUILDKIT_INLINE_CACHE=1

      - name: ECR push summary
        if: always()
        run: |
          echo "## 🚀 AWS ECR Push - Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Repository**: \`${{ env.ECR_REPO_URI }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Region**: \`${{ env.AWS_REGION }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Tags**: \`latest\`, \`optimized\`, \`<branch>-<sha>\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Image disponible sur AWS ECR pour déploiement ECS/Fargate" >> $GITHUB_STEP_SUMMARY

  deploy-to-ecs:
    name: Deploy to AWS ECS
    needs: push-to-aws
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) || (github.event_name == 'workflow_dispatch' && inputs.push_to_aws == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update ECS Service
        run: |
          echo "🔄 Mise à jour du service ECS..."
          aws ecs update-service \
            --cluster yukpomnang-cluster \
            --service yukpomnang-backend-service \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }} \
            --query 'service.{ServiceName:serviceName,Status:status,DesiredCount:desiredCount,RunningCount:runningCount}' \
            --output table
          
          echo ""
          echo "✅ Service ECS mis à jour, nouveau déploiement en cours..."
          echo "⏳ Le déploiement peut prendre 2-5 minutes"

      - name: Wait for deployment (optional)
        if: false  # Désactivé par défaut (prend du temps)
        run: |
          echo "⏳ Attente de la stabilisation du déploiement..."
          aws ecs wait services-stable \
            --cluster yukpomnang-cluster \
            --services yukpomnang-backend-service \
            --region ${{ env.AWS_REGION }}
          echo "✅ Déploiement terminé avec succès!"

      - name: Deployment summary
        if: always()
        run: |
          echo "## 🚀 AWS ECS Deployment - Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Cluster**: \`yukpomnang-cluster\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Service**: \`yukpomnang-backend-service\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Region**: \`${{ env.AWS_REGION }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Image**: \`${{ env.ECR_REPO_URI }}:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Nouveau déploiement déclenché avec l'image optimisée" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "💡 Surveillez le déploiement avec:" >> $GITHUB_STEP_SUMMARY
          echo "   \`aws ecs describe-services --cluster yukpomnang-cluster --services yukpomnang-backend-service --region ${{ env.AWS_REGION }}\`" >> $GITHUB_STEP_SUMMARY

