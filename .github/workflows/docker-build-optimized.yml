name: Docker Build Optimized

on:
  push:
    branches:
      - main
      - master
      - develop
    paths:
      - 'backend/**'
      - '.github/workflows/docker-build-optimized.yml'
      - 'infra/aws/**'
  pull_request:
    branches:
      - main
      - master
      - develop
    paths:
      - 'backend/**'
  workflow_dispatch:
    inputs:
      push_to_registry:
        description: 'Push to registry'
        required: false
        default: false
        type: boolean
      push_to_aws:
        description: 'Push to AWS ECR'
        required: false
        default: false
        type: boolean
      push_to_gcp:
        description: 'Push to GCP Cloud Run'
        required: false
        default: false
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/yukpo-backend-optimized
  AWS_REGION: eu-west-1
  AWS_ACCOUNT_ID: 108964700972
  ECR_REPO_NAME: yukpo-backend
  ECR_REPO_URI: 108964700972.dkr.ecr.eu-west-1.amazonaws.com/yukpo-backend
  SSM_DATABASE_URL_PATH: /yukpo/production/DATABASE_URL
  # GCP Configuration
  GCP_PROJECT_ID: yukpo-project
  GCP_REGION: europe-west1
  GCP_SERVICE_NAME: yukpo-backend
  GCP_ARTIFACT_REGISTRY_REPO: yukpo-backend
  GCP_IMAGE_NAME: europe-west1-docker.pkg.dev/yukpo-project/yukpo-backend/yukpo-backend

jobs:
  run-migrations:
    name: Run Database Migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) || (github.event_name == 'workflow_dispatch' && inputs.push_to_aws == 'true')
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        continue-on-error: true
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Cache Python dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('scripts/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python dependencies
        run: |
          pip install --cache-dir ~/.cache/pip -r scripts/requirements.txt

      - name: Install PostgreSQL client (for migration corrections)
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          psql --version

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
          override: true

      - name: Cache Rust dependencies
        id: cache-rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.cargo/.package-cache
          key: ${{ runner.os }}-sqlx-cli-v0.8.6-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-sqlx-cli-v0.8.6-
            ${{ runner.os }}-sqlx-cli-
            ${{ runner.os }}-cargo-

      - name: Check cache status
        run: |
          if [ "${{ steps.cache-rust.outputs.cache-hit }}" == "true" ]; then
            echo "✅ Cache Rust restauré avec succès"
            if command -v sqlx &> /dev/null; then
              echo "✅ sqlx-cli trouvé dans le cache"
            else
              echo "⚠️ Cache restauré mais sqlx-cli non trouvé"
            fi
          else
            echo "ℹ️ Cache Rust non trouvé, installation complète nécessaire"
          fi

      - name: Install sqlx-cli
        run: |
          if command -v sqlx &> /dev/null; then
            echo "✅ sqlx-cli trouvé dans le cache"
            sqlx --version
          else
            echo "📦 Installation de sqlx-cli..."
            echo "⏳ Cela peut prendre 5-10 minutes la première fois..."
            echo "💡 Les prochains runs utiliseront le cache (~30s)"
            cargo install sqlx-cli --version 0.8.6 --no-default-features --features postgres --locked
            echo "✅ sqlx-cli installé avec succès"
            sqlx --version
          fi

      - name: Run migrations
        env:
          SSM_DATABASE_URL_PATH: ${{ env.SSM_DATABASE_URL_PATH }}
          AWS_REGION: ${{ env.AWS_REGION }}
          FAIL_ON_MIGRATION_ERROR: false
        run: |
          python3 scripts/run_migrations_aws.py || echo "⚠️ Migrations non exécutées (seront exécutées au démarrage ECS)"

      - name: Migration summary
        if: always()
        run: |
          echo "## 🔄 Database Migrations - Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" == "success" ]; then
            echo "- **Status**: ✅ Migrations vérifiées et appliquées avec succès" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ job.status }}" == "failure" ]; then
            echo "- **Status**: ⚠️ Migrations non exécutées (connexion impossible depuis GitHub Actions)" >> $GITHUB_STEP_SUMMARY
            echo "- **Note**: Les migrations seront exécutées automatiquement au démarrage de l'application ECS" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Status**: Migrations vérifiées et appliquées si nécessaire" >> $GITHUB_STEP_SUMMARY
          fi
          echo "- **SSM Parameter**: \`${{ env.SSM_DATABASE_URL_PATH }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Region**: \`${{ env.AWS_REGION }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Fail on Error**: \`false\` (le build continue même si les migrations échouent)" >> $GITHUB_STEP_SUMMARY
          echo "- **Cache**: sqlx-cli et dépendances Python sont mis en cache pour accélérer les prochains runs" >> $GITHUB_STEP_SUMMARY

  build-and-push:
    name: Build and Push Optimized Docker Image
    needs: run-migrations
    if: always() && (needs.run-migrations.result == 'success' || needs.run-migrations.result == 'skipped' || needs.run-migrations.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx (with cache)
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:latest
            network=host

      - name: Restore Docker layer cache
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.push_to_registry == 'true')
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure AWS credentials for ECR (build job)
        if: ${{ (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) || (github.event_name == 'workflow_dispatch' && inputs.push_to_aws == 'true') }}
        uses: aws-actions/configure-aws-credentials@v4
        continue-on-error: true
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to AWS ECR
        if: ${{ (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) || (github.event_name == 'workflow_dispatch' && inputs.push_to_aws == 'true') }}
        uses: aws-actions/amazon-ecr-login@v2
        continue-on-error: true
        with:
          registries: ${{ env.AWS_ACCOUNT_ID }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=optimized

      - name: Prepare Dockerfile with root context
        run: |
          echo "=== Preparing Dockerfile for root context ==="
          if [ ! -f backend/Dockerfile.cloud.optimized ]; then
            echo "❌ ERROR: backend/Dockerfile.cloud.optimized not found!"
            exit 1
          fi
          sed -E \
            -e '/^COPY --from=/! s#^COPY (Cargo\.toml Cargo\.lock) #COPY backend/Cargo.toml backend/Cargo.lock #' \
            -e '/^COPY --from=/! s#^COPY \.sqlx #COPY backend/.sqlx #' \
            -e '/^COPY --from=/! s#^COPY (src|scripts|ia_prompts|config|migrations|blender) #COPY backend/\1 #' \
            -e '/^COPY --from=/! s#^COPY ([^/ ]+\.md) #COPY backend/\1 #' \
            -e '/^COPY --from=/! s#^COPY scripts/([^ ]+) #COPY backend/scripts/\1 #' \
            backend/Dockerfile.cloud.optimized > Dockerfile.build
          echo "✅ Dockerfile.build created at root with adjusted paths"
          ls -la Dockerfile.build
          echo "First 10 lines:"
          head -10 Dockerfile.build

      - name: Build and push Docker image (optimized with cache)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.build
          push: ${{ github.event_name != 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.push_to_registry == 'true') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha
            type=local,src=/tmp/.buildx-cache
          cache-to: |
            type=gha,mode=max
            type=local,dest=/tmp/.buildx-cache,mode=max
          platforms: linux/amd64
          build-args: |
            SQLX_OFFLINE=true
            BUILDKIT_INLINE_CACHE=1
          outputs: type=docker,dest=/tmp/image.tar

      - name: Save build time
        if: always()
        id: build-time
        run: |
          echo "started_at=$(date -u +%s)" >> $GITHUB_OUTPUT

      - name: Image size report
        if: always()
        run: |
          echo "## 📦 Image Size Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|------|" >> $GITHUB_STEP_SUMMARY
          docker images --format "table {{.Repository}}\t{{.Tag}}\t{{.Size}}" | grep -E "(${{ env.IMAGE_NAME }}|${{ env.ECR_REPO_NAME }})" | \
            awk '{print "| " $1 ":" $2 " | " $3 " |"}' >> $GITHUB_STEP_SUMMARY || echo "| N/A | Build failed |" >> $GITHUB_STEP_SUMMARY

      - name: Summary
        if: always()
        run: |
          echo "## ✅ Docker Build Optimized - Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Dockerfile**: \`Dockerfile.cloud.optimized\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Target size**: ~300-400MB (vs 2.4GB standard)" >> $GITHUB_STEP_SUMMARY
          echo "- **Base image**: \`debian:trixie-slim\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Features**: Optimized, no Blender, minimal dependencies" >> $GITHUB_STEP_SUMMARY
          echo "- **Cache**: GitHub Actions cache + local cache pour builds rapides" >> $GITHUB_STEP_SUMMARY
          if [ "${{ github.event_name }}" == "push" ] && ( [ "${{ github.ref }}" == "refs/heads/main" ] || [ "${{ github.ref }}" == "refs/heads/master" ] ); then
            echo "- **AWS ECR**: Image automatiquement poussée vers ECR" >> $GITHUB_STEP_SUMMARY
            echo "- **GCP Cloud Run**: Image automatiquement poussée vers GCP" >> $GITHUB_STEP_SUMMARY
          fi

  push-to-aws:
    name: Push to AWS ECR
    needs: build-and-push
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) || (github.event_name == 'workflow_dispatch' && inputs.push_to_aws == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        continue-on-error: true
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to AWS ECR
        uses: aws-actions/amazon-ecr-login@v2
        continue-on-error: true
        with:
          registries: ${{ env.AWS_ACCOUNT_ID }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata for ECR
        id: meta-ecr
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.ECR_REPO_URI }}
          tags: |
            type=sha,prefix={{branch}}-
            type=raw,value=latest
            type=raw,value=optimized
            type=ref,event=branch

      - name: Prepare Dockerfile for ECR build
        run: |
          if [ ! -f backend/Dockerfile.cloud.optimized ]; then
            echo "❌ ERROR: backend/Dockerfile.cloud.optimized not found!"
            exit 1
          fi
          sed -E \
            -e '/^COPY --from=/! s#^COPY (Cargo\.toml Cargo\.lock) #COPY backend/Cargo.toml backend/Cargo.lock #' \
            -e '/^COPY --from=/! s#^COPY \.sqlx #COPY backend/.sqlx #' \
            -e '/^COPY --from=/! s#^COPY (src|scripts|ia_prompts|config|migrations|blender) #COPY backend/\1 #' \
            -e '/^COPY --from=/! s#^COPY ([^/ ]+\.md) #COPY backend/\1 #' \
            -e '/^COPY --from=/! s#^COPY scripts/([^ ]+) #COPY backend/scripts/\1 #' \
            backend/Dockerfile.cloud.optimized > Dockerfile.build
          echo "✅ Dockerfile.build created for ECR build"

      - name: Build and push to ECR (from cache)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.build
          push: true
          tags: ${{ steps.meta-ecr.outputs.tags }}
          labels: ${{ steps.meta-ecr.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          build-args: |
            SQLX_OFFLINE=true
            BUILDKIT_INLINE_CACHE=1

      - name: ECR push summary
        if: always()
        run: |
          echo "## 🚀 AWS ECR Push - Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Repository**: \`${{ env.ECR_REPO_URI }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Region**: \`${{ env.AWS_REGION }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Tags**: \`latest\`, \`optimized\`, \`<branch>-<sha>\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Image disponible sur AWS ECR pour déploiement ECS/Fargate" >> $GITHUB_STEP_SUMMARY

  push-to-gcp:
    name: Push to GCP Cloud Run and Deploy
    needs: build-and-push
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) || (github.event_name == 'workflow_dispatch' && inputs.push_to_gcp == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Google Auth (Service Account Key)
        id: auth
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: 'google-github-actions/setup-gcloud@v2'
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker europe-west1-docker.pkg.dev
          gcloud auth configure-docker gcr.io

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata for GCP
        id: meta-gcp
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GCP_IMAGE_NAME }}
          tags: |
            type=sha,prefix={{branch}}-
            type=raw,value=latest
            type=raw,value=optimized
            type=ref,event=branch

      - name: Prepare Dockerfile for GCP build
        run: |
          if [ ! -f backend/Dockerfile.cloud.optimized ]; then
            echo "❌ ERROR: backend/Dockerfile.cloud.optimized not found!"
            exit 1
          fi
          sed -E \
            -e '/^COPY --from=/! s#^COPY (Cargo\.toml Cargo\.lock) #COPY backend/Cargo.toml backend/Cargo.lock #' \
            -e '/^COPY --from=/! s#^COPY \.sqlx #COPY backend/.sqlx #' \
            -e '/^COPY --from=/! s#^COPY (src|scripts|ia_prompts|config|migrations|blender) #COPY backend/\1 #' \
            -e '/^COPY --from=/! s#^COPY ([^/ ]+\.md) #COPY backend/\1 #' \
            -e '/^COPY --from=/! s#^COPY scripts/([^ ]+) #COPY backend/scripts/\1 #' \
            backend/Dockerfile.cloud.optimized > Dockerfile.build
          echo "✅ Dockerfile.build created for GCP build"

      - name: Build and push to Artifact Registry (from cache)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.build
          push: true
          tags: ${{ steps.meta-gcp.outputs.tags }}
          labels: ${{ steps.meta-gcp.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          build-args: |
            SQLX_OFFLINE=true
            BUILDKIT_INLINE_CACHE=1

      - name: Prepare Environment Variables for Cloud Run
        id: prepare-env
        run: |
          echo "Preparing environment variables from GitHub secrets..."
          
          # Créer un fichier JSON pour les variables d'environnement
          # NOTE: DATABASE_URL, REDIS_URL, MONGODB_URL, JWT_SECRET gérés comme secrets GCP
          # ✅ IMPORTANT: Toutes les variables doivent être ici pour éviter l'écrasement au déploiement
          if command -v jq &> /dev/null; then
            echo '{}' | jq \
              --arg allowed_origins "https://api.yukpo.com,https://yukpo.com" \
              '. + {
                "CLOUD_RUN": "true",
                "ENABLE_AUTO_MIGRATIONS": "true",
                "SQLX_OFFLINE": "true",
                "RUST_LOG": "info",
                "LOG_FORMAT": "json",
                "APP_ENV": "production",
                "ENVIRONMENT": "production",
                "ALLOWED_ORIGINS": $allowed_origins,
                "LAUNCH_PHASE_START_DATE": "2026-02-10T00:00:00Z",
                "GCP_PROJECT_ID": "${{ env.GCP_PROJECT_ID }}",
                "INSTANCE_ID": "backend-1",

                "DB_POOL_SIZE": "10",
                "DB_POOL_MIN_SIZE": "2",
                "DB_ACQUIRE_TIMEOUT_SECS": "30",
                "DB_HEALTH_CHECK_INTERVAL_SECS": "30",
                "DATABASE_TIMEOUT": "10",

                "API_MAX_PAYLOAD_SIZE": "10485760",
                "API_RATE_LIMIT_PER_MINUTE": "100",
                "API_REQUEST_TIMEOUT": "30",
                "REQUEST_TIMEOUT": "30",
                "RATE_LIMIT_IP": "200",

                "AI_REQUEST_TIMEOUT_SECONDS": "120",
                "ENABLE_AI_OPTIMIZATIONS": "true",
                "EMBEDDING_MAX_RETRIES": "3",
                "EMBEDDING_TIMEOUT_SECONDS": "60",

                "GPU_ENABLED": "true",
                "GPU_ENDPOINT": "http://34.140.79.59:8080",
                "GPU_ZONE": "europe-west1-b",
                "GPU_INSTANCE_NAME": "yukpo-gpu-worker",
                "GPU_MONTHLY_BUDGET": "100.0",
                "GPU_SCALE_UP_THRESHOLD": "70.0",
                "GPU_SCALE_DOWN_THRESHOLD": "20.0",
                "GPU_MAX_INSTANCES": "3",
                "GPU_MIN_INSTANCES": "0",

                "VIDEO_GENERATION_TIMEOUT_SECONDS": "600",
                "VIDEO_ANALYSIS_TIMEOUT_SECONDS": "180",
                "VIDEO_RENDERER_ENABLE_GPU": "true",
                "VIDEO_RENDERER_MAX_RETRIES": "2",
                "VIDEO_RENDERER_TIMEOUT_SECS": "900",
                "VIDEO_RENDERER_RPC_URL": "http://34.140.79.59:8080/render",
                "AUDIO_SYNC_TIMEOUT_SECONDS": "180",
                "MAX_VIDEO_SIZE_MB": "50",
                "MAX_AUDIO_SIZE_MB": "10",
                "MAX_IMAGE_SIZE_MB": "10",

                "UPLOAD_BASE_URL": "https://storage.googleapis.com/yukpo-project-yukpo-backend-media",
                "PUBLIC_BASE_URL": "https://storage.googleapis.com/yukpo-project-yukpo-backend-media",
                "UPLOAD_STORAGE_PATH": "uploads",
                "S3_BUCKET": "yukpo-project-yukpo-backend-media",
                "S3_REGION": "europe-west1",
                "S3_ENDPOINT": "https://storage.googleapis.com",
                "S3_FORCE_PATH_STYLE": "false",
                "RENDERER_S3_UPLOAD": "true",

                "LIVEKIT_INGRESS_MODE": "rtmp",
                "LIVEKIT_INGRESS_NAME": "prod-ingress-1",
                "LIVEKIT_INGRESS_REGION": "europe-west1",
                "LIVEKIT_INGRESS_ROOM": "live-events",
                "LIVE_FALLBACK_ENABLED": "true",
                "LIVE_RECORDING_ENABLED": "true",

                "EMAIL_ENABLED": "true",
                "EMAIL_PROVIDER": "sendgrid",
                "SENDGRID_FROM_EMAIL": "noreply@yukpomnang.com",
                "SENDGRID_FROM_NAME": "Yukpomnang",
                "SMS_ENABLED": "true",
                "SMS_PROVIDER": "twilio",

                "SEARCH_DEFAULT_LANGUAGE": "fr",
                "SEARCH_DEFAULT_RADIUS_KM": "20",
                "SEARCH_MAX_RESULTS": "50",
                "SEARCH_TITLE_BOOST": "2.0",
                "SEMANTIC_CACHE_THRESHOLD": "0.85",
                "CACHE_DEFAULT_TTL": "3600",
                "CACHE_TTL_SEARCH": "600",

                "DELIVERY_MATCHING_WORKER_BATCH_SIZE": "50",
                "DELIVERY_MATCHING_WORKER_INTERVAL_SECS": "30",
                "DELIVERY_MATCHING_WORKER_PARALLEL": "3",
                "DELIVERY_PENDING_TIMEOUT_MINUTES": "60",
                "DELIVERY_TIMEOUT_MONITOR_INTERVAL_SECS": "60",
                "MATCHING_MIN_SCORE_THRESHOLD": "0.6",

                "SLA_PROMISED_MINUTES": "30",
                "SLA_THRESHOLD_RATIO": "1.10",
                "SLA_LOOKBACK_MINUTES": "60",
                "SLA_MONITOR_INTERVAL_SECONDS": "300",

                "GLOBAL_PROMO_SCHEDULER_INTERVAL_SECS": "30",
                "JWT_EXPIRATION_HOURS": "24",
                "KYC_PROVIDER": "manual",
                "ML_MODELS_DIR": "models",
                "YUKPO_IMMO_COMMISSION_RATE": "0.05"
              }' > env-vars.json
          else
            # Fallback: JSON manuel (variables les plus critiques)
            # NOTE: DATABASE_URL, REDIS_URL, MONGODB_URL, JWT_SECRET gérés comme secrets GCP
            cat > env-vars.json << EOF
          {
            "CLOUD_RUN": "true",
            "ENABLE_AUTO_MIGRATIONS": "true",
            "SQLX_OFFLINE": "true",
            "RUST_LOG": "info",
            "APP_ENV": "production",
            "ENVIRONMENT": "production",
            "ALLOWED_ORIGINS": "https://api.yukpo.com,https://yukpo.com",
            "GCP_PROJECT_ID": "${{ secrets.GCP_PROJECT_ID }}",
            "GPU_ENABLED": "true",
            "GPU_ENDPOINT": "http://34.140.79.59:8080",
            "GPU_ZONE": "europe-west1-b",
            "GPU_INSTANCE_NAME": "yukpo-gpu-worker",
            "GPU_MONTHLY_BUDGET": "100.0",
            "GPU_MAX_INSTANCES": "3",
            "GPU_MIN_INSTANCES": "0",
            "VIDEO_RENDERER_RPC_URL": "http://34.140.79.59:8080/render",
            "VIDEO_RENDERER_ENABLE_GPU": "true",
            "LIVEKIT_INGRESS_MODE": "rtmp",
            "LIVEKIT_INGRESS_REGION": "europe-west1",
            "LIVE_FALLBACK_ENABLED": "true",
            "LIVE_RECORDING_ENABLED": "true",
            "S3_BUCKET": "yukpo-project-yukpo-backend-media",
            "S3_REGION": "europe-west1",
            "S3_ENDPOINT": "https://storage.googleapis.com",
            "S3_FORCE_PATH_STYLE": "false",
            "SEARCH_DEFAULT_LANGUAGE": "fr",
            "JWT_EXPIRATION_HOURS": "24",
            "KYC_PROVIDER": "manual"
          }
          EOF
          fi
          
          # Ajouter toutes les variables avec prefixe GCP_ENV_
          if command -v gh &> /dev/null; then
            gh auth status || gh auth login --with-token <<< "${{ secrets.GITHUB_TOKEN }}"
            for secret in $(gh secret list --repo ${{ github.repository }} --json name -q '.[].name' | grep "^GCP_ENV_"); do
              VAR_NAME=$(echo $secret | sed 's/^GCP_ENV_//')
              VAR_VALUE=$(gh secret get $secret --repo ${{ github.repository }} 2>/dev/null || echo "")
              if [ -n "$VAR_VALUE" ]; then
                if command -v jq &> /dev/null; then
                  jq --arg key "$VAR_NAME" --arg val "$VAR_VALUE" '. + {($key): $val}' env-vars.json > env-vars.tmp.json && mv env-vars.tmp.json env-vars.json
                else
                  # Fallback: échapper et ajouter avec sed
                  VAR_VALUE_ESCAPED=$(echo "$VAR_VALUE" | sed 's/\\/\\\\/g' | sed 's/"/\\"/g')
                  sed -i "s/}$/,\"$VAR_NAME\":\"$VAR_VALUE_ESCAPED\"}/" env-vars.json
                fi
              fi
            done
          fi
          
          echo "env_file=env-vars.json" >> $GITHUB_OUTPUT

      - name: Deploy to Cloud Run
        run: |
          echo "🔄 Deploying to Cloud Run..."
          
          # ✅ CORRIGÉ: Utiliser --update-env-vars au lieu de --env-vars-file pour ne pas écraser
          # NOTE: --set-cloudsql-instances dans le deploy remplace atomiquement (pas besoin de clear séparé)
          # les variables dynamiques (LIVEKIT_API_URL, LIVEKIT_WS_URL, SRS_*) définies par deploy-livekit-gcp.ps1
          echo "Construction de la liste des variables depuis env-vars.json..."
          if command -v jq &> /dev/null; then
            ENV_VARS=$(jq -r 'to_entries | map("\(.key)=\(.value)") | join(",")' ${{ steps.prepare-env.outputs.env_file }})
          else
            ENV_VARS=$(python3 -c "import json; d=json.load(open('${{ steps.prepare-env.outputs.env_file }}')); print(','.join(f'{k}={v}' for k,v in d.items()))")
          fi
          
          echo "🚀 Déploiement vers Cloud Run avec instance yukpo-postgres uniquement..."
          gcloud run deploy ${{ env.GCP_SERVICE_NAME }} \
            --image ${{ env.GCP_IMAGE_NAME }}:latest \
            --platform managed \
            --region ${{ env.GCP_REGION }} \
            --allow-unauthenticated \
            --update-env-vars="$ENV_VARS" \
            --update-secrets="JWT_SECRET=jwt-secret:latest,DATABASE_URL=database-url:latest,REDIS_URL=redis-url:latest,MONGODB_URL=mongodb-url:latest,OPENAI_API_KEY=openai-api-key:latest,S3_ACCESS_KEY=s3-access-key:latest,S3_SECRET_KEY=s3-secret-key:latest,LIVEKIT_API_KEY=livekit-api-key:latest,LIVEKIT_API_SECRET=livekit-api-secret:latest" \
            --set-cloudsql-instances=${{ secrets.GCP_PROJECT_ID }}:${{ env.GCP_REGION }}:yukpo-postgres \
            --memory 2Gi \
            --cpu 2 \
            --timeout 900 \
            --max-instances 10 \
            --cpu-boost \
            --cpu-throttling \
            --service-account ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }} \
            --project ${{ secrets.GCP_PROJECT_ID }}
          
          echo "✅ Cloud Run deployment completed"

      - name: Get Service URL
        id: service-url
        run: |
          URL=$(gcloud run services describe ${{ env.GCP_SERVICE_NAME }} \
            --region ${{ env.GCP_REGION }} \
            --format 'value(status.url)' \
            --project ${{ secrets.GCP_PROJECT_ID }})
          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: GCP deployment summary
        if: always()
        run: |
          echo "## 🚀 GCP Cloud Run Push & Deployment - Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Artifact Registry**: \`${{ env.GCP_IMAGE_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Cloud Run Service**: \`${{ env.GCP_SERVICE_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Region**: \`${{ env.GCP_REGION }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **URL**: \`${{ steps.service-url.outputs.url }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Tags**: \`latest\`, \`optimized\`, \`<branch>-<sha>\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Image poussée vers GCR et Cloud Run mis à jour" >> $GITHUB_STEP_SUMMARY
          echo "✅ Migrations automatiques activées (ENABLE_AUTO_MIGRATIONS=true)" >> $GITHUB_STEP_SUMMARY

  deploy-to-ecs:
    name: Deploy to AWS ECS
    needs: push-to-aws
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) || (github.event_name == 'workflow_dispatch' && inputs.push_to_aws == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        continue-on-error: true
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check if ECS Service exists
        id: check-service
        run: |
          echo "🔍 Vérification de l'existence du service ECS..."
          SERVICE_EXISTS=$(aws ecs describe-services \
            --cluster yukpo-cluster \
            --services yukpo-backend-service \
            --region ${{ env.AWS_REGION }} \
            --query 'services[0].status' \
            --output text 2>/dev/null || echo "MISSING")
          
          if [ "$SERVICE_EXISTS" = "MISSING" ] || [ "$SERVICE_EXISTS" = "None" ] || [ -z "$SERVICE_EXISTS" ]; then
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "⚠️ Service ECS n'existe pas encore"
          else
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "✅ Service ECS existe"
          fi

      - name: Service ECS not found (warning only)
        if: steps.check-service.outputs.exists == 'false'
        run: |
          echo "⚠️ Service ECS n'existe pas encore" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ L'image Docker a été buildée et poussée avec succès vers ECR" >> $GITHUB_STEP_SUMMARY

      - name: Update ECS Service
        if: steps.check-service.outputs.exists == 'true'
        run: |
          echo "🔄 Mise à jour du service ECS..."
          aws ecs update-service \
            --cluster yukpo-cluster \
            --service yukpo-backend-service \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }} \
            --query 'service.{ServiceName:serviceName,Status:status,DesiredCount:desiredCount,RunningCount:runningCount}' \
            --output table
          
          echo ""
          echo "✅ Service ECS mis à jour, nouveau déploiement en cours..."

      - name: Deployment summary
        if: always()
        run: |
          echo "## 🚀 AWS ECS Deployment - Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Cluster**: \`yukpo-cluster\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Service**: \`yukpo-backend-service\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Region**: \`${{ env.AWS_REGION }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Image**: \`${{ env.ECR_REPO_URI }}:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Nouveau déploiement déclenché avec l'image optimisée" >> $GITHUB_STEP_SUMMARY
