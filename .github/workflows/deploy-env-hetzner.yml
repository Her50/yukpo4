name: Deploy .env to Hetzner

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Force deployment even if .env exists'
        required: false
        default: 'false'
        type: boolean

env:
  HETZNER_HOST: 46.224.14.85
  HETZNER_USER: root
  HETZNER_DIR: /opt/yukpo

jobs:
  deploy-env:
    name: Deploy .env to Hetzner
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}

      - name: Add Hetzner to known hosts
        run: |
          ssh-keyscan -H ${{ env.HETZNER_HOST }} >> ~/.ssh/known_hosts

      - name: Test SSH connection
        run: |
          ssh -o StrictHostKeyChecking=no ${{ env.HETZNER_USER }}@${{ env.HETZNER_HOST }} "echo '✅ SSH connection successful'"

      - name: Generate .env file from AWS
        run: |
          echo "📥 Retrieving environment variables from AWS..."
          
          # Install AWS CLI if not present
          if ! command -v aws &> /dev/null; then
            echo "Installing AWS CLI..."
            curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
            unzip awscliv2.zip
            sudo ./aws/install
          fi
          
          # Configure AWS credentials (from GitHub secrets)
          mkdir -p ~/.aws
          cat > ~/.aws/credentials << EOF
[default]
aws_access_key_id = ${{ secrets.AWS_ACCESS_KEY_ID }}
aws_secret_access_key = ${{ secrets.AWS_SECRET_ACCESS_KEY }}
EOF
          echo "[default]" > ~/.aws/config
          echo "region = us-east-1" >> ~/.aws/config
          
          # Get ECS Task Definition
          TASK_DEF=$(aws ecs describe-services \
            --cluster yukpomnang-cluster \
            --services yukpomnang-backend-service \
            --region us-east-1 \
            --query 'services[0].taskDefinition' \
            --output text)
          
          if [ -z "$TASK_DEF" ] || [ "$TASK_DEF" == "None" ]; then
            echo "⚠️ Could not get task definition, using create-env-hetzner.sh if available"
            if [ -f create-env-hetzner.sh ]; then
              echo "✅ Found create-env-hetzner.sh, will use it"
            else
              echo "❌ No task definition and no create-env-hetzner.sh found"
              exit 1
            fi
          else
            echo "✅ Task definition: $TASK_DEF"
            
            # Get container definition
            CONTAINER_DEF=$(aws ecs describe-task-definition \
              --task-definition "$TASK_DEF" \
              --region us-east-1 \
              --query 'taskDefinition.containerDefinitions[0]' \
              --output json)
            
            echo "📝 Extracting environment variables..."
            
            # Create .env file
            cat > hetzner.env << 'ENVEOF'
# Environment variables for Hetzner
# Generated: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
ENVEOF
            
            # Extract environment variables
            echo "$CONTAINER_DEF" | jq -r '.environment[]? | "\(.name)=\(.value)"' >> hetzner.env
            
            # Extract secrets from SSM
            echo "$CONTAINER_DEF" | jq -r '.secrets[]? | select(.valueFrom | startswith("arn:aws:ssm:")) | .valueFrom' | while read -r ARN; do
              PARAM_NAME=$(echo "$ARN" | sed 's/arn:aws:ssm:[^:]*:[^:]*:parameter\///')
              SECRET_NAME=$(echo "$CONTAINER_DEF" | jq -r --arg arn "$ARN" '.secrets[]? | select(.valueFrom == $arn) | .name')
              
              echo "  Retrieving: $PARAM_NAME -> $SECRET_NAME"
              VALUE=$(aws ssm get-parameter \
                --name "$PARAM_NAME" \
                --region us-east-1 \
                --with-decryption \
                --query 'Parameter.Value' \
                --output text 2>/dev/null || echo "")
              
              if [ -n "$VALUE" ] && [ "$VALUE" != "None" ]; then
                # Adapt for Hetzner Docker
                case "$SECRET_NAME" in
                  DATABASE_URL)
                    VALUE=$(echo "$VALUE" | sed 's/@[^/]*\//@postgres:5432\//')
                    ;;
                  REDIS_URL)
                    VALUE=$(echo "$VALUE" | sed 's/@[^:]*:[0-9]*/@redis:6379/')
                    ;;
                esac
                echo "$SECRET_NAME=$VALUE" >> hetzner.env
              fi
            done
            
            # Extract secrets from Secrets Manager
            echo "$CONTAINER_DEF" | jq -r '.secrets[]? | select(.valueFrom | startswith("arn:aws:secretsmanager:")) | .valueFrom' | while read -r ARN; do
              SECRET_NAME=$(echo "$CONTAINER_DEF" | jq -r --arg arn "$ARN" '.secrets[]? | select(.valueFrom == $arn) | .name')
              
              echo "  Retrieving from Secrets Manager: $SECRET_NAME"
              SECRET_VALUE=$(aws secretsmanager get-secret-value \
                --secret-id "$ARN" \
                --region us-east-1 \
                --query 'SecretString' \
                --output text 2>/dev/null || echo "")
              
              if [ -n "$SECRET_VALUE" ] && [ "$SECRET_VALUE" != "None" ]; then
                # Try to parse as JSON
                if echo "$SECRET_VALUE" | jq empty 2>/dev/null; then
                  # It's JSON, extract all keys
                  echo "$SECRET_VALUE" | jq -r 'to_entries[] | "\(.key)=\(.value)"' >> hetzner.env
                else
                  # It's a plain string
                  echo "$SECRET_NAME=$SECRET_VALUE" >> hetzner.env
                fi
              fi
            done
            
            # Add Hetzner-specific overrides
            cat >> hetzner.env << 'ENVEOF'

# Hetzner-specific overrides
S3_ENDPOINT=s3.eu-central-1.wasabisys.com
S3_BUCKET=yukpo-video-prod
S3_REGION=eu-central-1
S3_ACCESS_KEY=${{ secrets.WASABI_ACCESS_KEY }}
S3_SECRET_KEY=${{ secrets.WASABI_SECRET_KEY }}
S3_FORCE_PATH_STYLE=true

LIVEKIT_API_URL=http://46.224.14.85:7880
LIVEKIT_WS_URL=ws://46.224.14.85:7880
SRS_HLS_URL=https://srs.46.224.14.85.sslip.io/live
SRS_RTMP_URL=rtmp://46.224.14.85:1935/live
VIDEO_RENDERER_RPC_URL=http://46.224.14.85:8088/render

HOST=0.0.0.0
PORT=8080
ENVIRONMENT=production
RUST_LOG=info
ENVEOF
            
            echo "✅ Generated hetzner.env with $(wc -l < hetzner.env) lines"
          fi

      - name: Use existing create-env-hetzner.sh if available
        if: failure()
        run: |
          if [ -f create-env-hetzner.sh ]; then
            echo "✅ Using existing create-env-hetzner.sh"
            chmod +x create-env-hetzner.sh
          else
            echo "❌ No create-env-hetzner.sh found"
            exit 1
          fi

      - name: Deploy .env to Hetzner
        run: |
          echo "🚀 Deploying .env to Hetzner..."
          
          if [ -f hetzner.env ]; then
            # Copy .env file directly
            scp -o StrictHostKeyChecking=no hetzner.env ${{ env.HETZNER_USER }}@${{ env.HETZNER_HOST }}:${{ env.HETZNER_DIR }}/.env
            ssh -o StrictHostKeyChecking=no ${{ env.HETZNER_USER }}@${{ env.HETZNER_HOST }} "chmod 600 ${{ env.HETZNER_DIR }}/.env && echo '✅ .env file deployed'"
          elif [ -f create-env-hetzner.sh ]; then
            # Copy and execute the script
            scp -o StrictHostKeyChecking=no create-env-hetzner.sh ${{ env.HETZNER_USER }}@${{ env.HETZNER_HOST }}:/tmp/create-env-hetzner.sh
            ssh -o StrictHostKeyChecking=no ${{ env.HETZNER_USER }}@${{ env.HETZNER_HOST }} "chmod +x /tmp/create-env-hetzner.sh && bash /tmp/create-env-hetzner.sh"
          else
            echo "❌ No .env file or script found"
            exit 1
          fi

      - name: Verify .env on Hetzner
        run: |
          echo "✅ Verifying .env file on Hetzner..."
          ssh -o StrictHostKeyChecking=no ${{ env.HETZNER_USER }}@${{ env.HETZNER_HOST }} << 'EOF'
            cd ${{ env.HETZNER_DIR }}
            if [ -f .env ]; then
              echo "✅ .env file exists"
              echo "📊 File info:"
              ls -lh .env
              echo ""
              echo "📋 First 20 lines (sanitized):"
              head -20 .env | sed 's/=.*/=***HIDDEN***/'
              echo ""
              echo "📈 Total lines: $(wc -l < .env)"
            else
              echo "❌ .env file not found"
              exit 1
            fi
          EOF

      - name: Deployment summary
        if: always()
        run: |
          echo "## ✅ .env Deployment to Hetzner - Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Host**: \`${{ env.HETZNER_HOST }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Directory**: \`${{ env.HETZNER_DIR }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ✅ Successfully deployed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "💡 The .env file is now ready on Hetzner for Docker Compose" >> $GITHUB_STEP_SUMMARY

