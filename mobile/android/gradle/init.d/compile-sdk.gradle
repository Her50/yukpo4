// ✅ SOLUTION 2: Script init.gradle pour définir compileSdkVersion AVANT l'évaluation
// Les scripts init.d s'exécutent AVANT settings.gradle, garantissant que compileSdkVersion
// est disponible lorsque expo-modules-core/android est évalué

gradle.projectsLoaded {
    gradle.allprojects { project ->
        // Définir compileSdkVersion dans rootProject.ext pour tous les projets
        if (!project.rootProject.hasProperty('ext')) {
            project.rootProject.ext = [:]
        }
        
        // Définir compileSdkVersion, minSdkVersion, targetSdkVersion
        project.rootProject.ext.compileSdkVersion = 35
        project.rootProject.ext.minSdkVersion = 24
        project.rootProject.ext.targetSdkVersion = 35
        
        // Pour les projets inclus via includeBuild, définir aussi dans project.ext
        project.ext.compileSdkVersion = 35
        project.ext.minSdkVersion = 24
        project.ext.targetSdkVersion = 35
    }
}



