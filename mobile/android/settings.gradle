pluginManagement {
    includeBuild(new File(["node", "--print", "require.resolve('@react-native/gradle-plugin/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim()).getParentFile().toString())
    // ✅ CORRIGÉ: Inclure le plugin expo-module-gradle-plugin pour qu'il soit disponible
    // kotlinVersion doit être défini dans gradle.properties pour qu'il soit accessible dans le projet inclus
    def expoModulesCorePath = new File(["node", "--print", "require.resolve('expo-modules-core/package.json', { paths: [require.resolve('expo/package.json')] })"].execute(null, rootDir).text.trim()).getParentFile()
    includeBuild(new File(expoModulesCorePath, "android"))
}
plugins { id("com.facebook.react.settings") }

extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
  if (System.getenv('EXPO_USE_COMMUNITY_AUTOLINKING') == '1') {
    ex.autolinkLibrariesFromCommand()
  } else {
    def command = [
      'node',
      '--no-warnings',
      '--eval',
      'require(require.resolve(\'expo-modules-autolinking\', { paths: [require.resolve(\'expo/package.json\')] }))(process.argv.slice(1))',
      'react-native-config',
      '--json',
      '--platform',
      'android'
    ].toList()
    ex.autolinkLibrariesFromCommand(command)
  }
}

rootProject.name = 'Yukpomnang'

dependencyResolutionManagement {
  // ✅ CORRIGÉ: Configuration explicite des repositories pour éviter les timeouts
  repositoriesMode.set(RepositoriesMode.PREFER_PROJECT)
  repositories {
    // Ordre important - repositories publics en premier
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
    // ✅ CORRIGÉ 2025-01-XX: Dépôt de fallback pour le plugin JFrog Artifactory
    // Si EAS Build essaie d'utiliser un dépôt interne qui timeout, on utilise Maven Central
    maven {
      name = "Maven Central Fallback"
      url = uri("https://repo1.maven.org/maven2/")
    }
    // React Native repositories locaux
    maven {
      url(new File(['node', '--print', "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim(), '../android'))
    }
    maven {
      url(new File(['node', '--print', "require.resolve('jsc-android/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim(), '../dist'))
    }
  }
  versionCatalogs {
    reactAndroidLibs {
      from(files(new File(["node", "--print", "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim(), "../gradle/libs.versions.toml")))
    }
  }
}

apply from: new File(["node", "--print", "require.resolve('expo/package.json')"].execute(null, rootDir).text.trim(), "../scripts/autolinking.gradle");
useExpoModules()

include ':app'
includeBuild(new File(["node", "--print", "require.resolve('@react-native/gradle-plugin/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim()).getParentFile())
