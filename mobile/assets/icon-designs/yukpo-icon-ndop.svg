<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- ✅ FOND MODERNE : Optimisé pour contraste avec le Y orange/jaune (#F7971E → #FFD200) -->
    <!-- Option 1 : Gradient bleu foncé/indigo (meilleur contraste avec orange/jaune) -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E3A8A;stop-opacity:1" />  <!-- Bleu foncé moderne -->
      <stop offset="50%" style="stop-color:#3B82F6;stop-opacity:1" />  <!-- Bleu vif (complémentaire de l'orange) -->
      <stop offset="100%" style="stop-color:#6366F1;stop-opacity:1" /> <!-- Indigo moderne -->
    </linearGradient>
    
    <!-- ✅ Option 2 (commentée) : Gradient violet/indigo/rose (alternative moderne) -->
    <!--
    <linearGradient id="bgGradientAlt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1;stop-opacity:1" />  <!-- Indigo moderne -->
      <stop offset="50%" style="stop-color:#8B5CF6;stop-opacity:1" />  <!-- Violet moderne -->
      <stop offset="100%" style="stop-color:#EC4899;stop-opacity:1" /> <!-- Rose moderne -->
    </linearGradient>
    -->
    
    <!-- ✅ ANCIEN FOND (commenté) : Fond bleu indigo traditionnel du ndop -->
    <!--
    <linearGradient id="bgGradientOld" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A237E;stop-opacity:1" />
