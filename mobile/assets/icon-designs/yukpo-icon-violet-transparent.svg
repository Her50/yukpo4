<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient violet pour le Y -->
    <linearGradient id="yGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#A78BFA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1" />
    </linearGradient>
    
    <!-- Ombre portée pour le Y -->
    <filter id="yShadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12"/>
      <feOffset dx="0" dy="12" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.5"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Brillance sur le Y -->
    <linearGradient id="yShine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.5" />
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0" />
    </linearGradient>
  </defs>
  
  <!-- Fond transparent (ou blanc léger pour visibilité) -->
  <!-- Pour un fond complètement transparent, décommentez la ligne suivante et commentez le rectangle -->
  <!-- <rect width="1024" height="1024" fill="none" rx="180"/> -->
  
  <!-- Fond blanc très léger pour meilleure visibilité sur tous les fonds -->
  <rect width="1024" height="1024" fill="#FFFFFF" fill-opacity="0.95" rx="180"/>
  
  <!-- La lettre Y stylisée en VIOLET avec CONTRASTE MAXIMAL -->
  <g filter="url(#yShadow)">
    <!-- Branche gauche du Y - ÉPAISSE -->
    <path d="M 250 250 L 512 520 L 470 570 L 208 300 Z" 
          fill="url(#yGradient)" 
          stroke="#FFFFFF" 
          stroke-width="10" 
          stroke-linejoin="round"/>
    
    <!-- Branche droite du Y - ÉPAISSE -->
    <path d="M 774 250 L 512 520 L 554 570 L 816 300 Z" 
          fill="url(#yGradient)" 
          stroke="#FFFFFF" 
          stroke-width="10" 
          stroke-linejoin="round"/>
    
    <!-- Tige du Y - ÉPAISSE -->
    <path d="M 470 520 L 554 520 L 554 810 L 470 810 Z" 
          fill="url(#yGradient)" 
          stroke="#FFFFFF" 
          stroke-width="10" 
          stroke-linejoin="round"/>
    
    <!-- Effet de brillance sur le Y -->
    <path d="M 260 260 L 512 530 L 480 570 L 228 310 Z" 
          fill="url(#yShine)" 
          opacity="0.6"/>
    <path d="M 764 260 L 512 530 L 544 570 L 796 310 Z" 
          fill="url(#yShine)" 
          opacity="0.6"/>
    <path d="M 480 530 L 544 530 L 544 780 L 480 780 Z" 
          fill="url(#yShine)" 
          opacity="0.6"/>
  </g>
  
  <!-- Étoile moderne en bas en violet -->
  <g opacity="0.8">
    <circle cx="512" cy="920" r="10" fill="#8B5CF6" stroke="#FFFFFF" stroke-width="3"/>
    <path d="M 512 895 L 520 910 L 535 910 L 522 920 L 525 935 L 512 925 L 499 935 L 502 920 L 489 910 L 504 910 Z" 
          fill="#8B5CF6" 
          stroke="#FFFFFF" 
          stroke-width="3"/>
  </g>
</svg>

