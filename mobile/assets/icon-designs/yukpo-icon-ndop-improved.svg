<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Fond bleu indigo traditionnel du ndop (DOMINANT et VISIBLE) -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A237E;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#283593;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1A237E;stop-opacity:1" />
    </linearGradient>
    
    <!-- Gradient pour le Y (plus contrasté) -->
    <linearGradient id="yGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F7971E;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFD200;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F7971E;stop-opacity:1" />
    </linearGradient>
    
    <!-- Motif Ndop - Losanges avec TRAITS ÉPAIS et COULEURS CONTRASTÉES -->
    <pattern id="ndopPattern" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
      <!-- Losange principal - BLANC/CRÈME pour contraste fort (traditionnel ndop) -->
      <path d="M 50 0 L 100 50 L 50 100 L 0 50 Z" 
            fill="none" 
            stroke="#FFFFFF" 
            stroke-width="6" 
            opacity="0.95"/>
      
      <!-- Losange intérieur - BLEU CLAIR pour profondeur -->
      <path d="M 50 25 L 75 50 L 50 75 L 25 50 Z" 
            fill="none" 
            stroke="#64B5F6" 
            stroke-width="5" 
            opacity="0.9"/>
      
      <!-- Lignes diagonales principales - BLANC ÉPAIS (motif ndop classique) -->
      <line x1="0" y1="0" x2="100" y2="100" stroke="#FFFFFF" stroke-width="6" opacity="0.9"/>
      <line x1="100" y1="0" x2="0" y2="100" stroke="#FFFFFF" stroke-width="6" opacity="0.9"/>
      
      <!-- Lignes diagonales secondaires - BLEU CLAIR pour texture -->
      <line x1="25" y1="0" x2="75" y2="100" stroke="#64B5F6" stroke-width="4" opacity="0.8"/>
      <line x1="75" y1="0" x2="25" y2="100" stroke="#64B5F6" stroke-width="4" opacity="0.8"/>
      
      <!-- Points d'accent - BLEU INDIGO FONCÉ pour contraste -->
      <circle cx="50" cy="50" r="5" fill="#1A237E" opacity="0.9"/>
      <circle cx="25" cy="25" r="4" fill="#283593" opacity="0.85"/>
      <circle cx="75" cy="75" r="4" fill="#283593" opacity="0.85"/>
    </pattern>
    
    <!-- Motif Ndop - Zigzags avec TRAITS ÉPAIS -->
    <pattern id="ndopZigzag" x="0" y="0" width="80" height="50" patternUnits="userSpaceOnUse">
      <path d="M 0 25 L 20 0 L 40 25 L 60 0 L 80 25" 
            fill="none" 
            stroke="#FFFFFF" 
            stroke-width="7" 
            opacity="0.95"
            stroke-linecap="round"/>
      <path d="M 0 25 L 20 50 L 40 25 L 60 50 L 80 25" 
            fill="none" 
            stroke="#64B5F6" 
            stroke-width="6" 
            opacity="0.9"
            stroke-linecap="round"/>
    </pattern>
    
    <!-- Motif Ndop - Triangles simplifiés avec TRAITS ÉPAIS -->
    <pattern id="ndopTriangles" x="0" y="0" width="120" height="120" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 120 60 L 60 120 L 0 60 Z" 
            fill="none" 
            stroke="#FFFFFF" 
            stroke-width="6" 
            opacity="0.9"
            stroke-linejoin="round"/>
      <path d="M 30 30 L 90 30 L 60 90 Z" 
            fill="none" 
            stroke="#64B5F6" 
            stroke-width="5" 
            opacity="0.85"
            stroke-linejoin="round"/>
    </pattern>
    
    <!-- Ombre portée pour le Y -->
    <filter id="yShadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dx="0" dy="10" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.4"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Brillance sur le Y -->
    <linearGradient id="yShine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0" />
    </linearGradient>
  </defs>
  
  <!-- Fond BLEU INDIGO DOMINANT (couleur traditionnelle du ndop) -->
  <rect width="1024" height="1024" fill="url(#bgGradient)" rx="180"/>
  
  <!-- Couche de motif Ndop - Losanges (OPACITÉ MAXIMALE pour visibilité) -->
  <rect width="1024" height="1024" fill="url(#ndopPattern)" rx="180" opacity="1.0"/>
  
  <!-- Couche de motif Ndop - Triangles (pour plus de texture) -->
  <rect width="1024" height="1024" fill="url(#ndopTriangles)" rx="180" opacity="0.9"/>
  
  <!-- Couche de motif Ndop - Zigzags sur les bords (OPACITÉ MAXIMALE) -->
  <rect x="0" y="0" width="1024" height="300" fill="url(#ndopZigzag)" opacity="1.0"/>
  <rect x="0" y="724" width="1024" height="300" fill="url(#ndopZigzag)" opacity="1.0"/>
  <rect x="0" y="0" width="300" height="1024" fill="url(#ndopZigzag)" opacity="1.0"/>
  <rect x="724" y="0" width="300" height="1024" fill="url(#ndopZigzag)" opacity="1.0"/>
  
  <!-- Cercle central très subtil pour mettre en valeur le Y (OPACITÉ MINIMALE) -->
  <circle cx="512" cy="512" r="400" fill="#1A237E" opacity="0.15"/>
  
  <!-- La lettre Y stylisée et moderne (PLUS ÉPAISSE pour visibilité) -->
  <g filter="url(#yShadow)">
    <!-- Branche gauche du Y -->
    <path d="M 260 260 L 512 520 L 480 560 L 228 300 Z" 
          fill="url(#yGradient)" 
          stroke="#FFFFFF" 
          stroke-width="6" 
          stroke-linejoin="round"/>
    
    <!-- Branche droite du Y -->
    <path d="M 764 260 L 512 520 L 544 560 L 796 300 Z" 
          fill="url(#yGradient)" 
          stroke="#FFFFFF" 
          stroke-width="6" 
          stroke-linejoin="round"/>
    
    <!-- Tige centrale du Y -->
    <path d="M 480 520 L 544 520 L 544 800 L 480 800 Z" 
          fill="url(#yGradient)" 
          stroke="#FFFFFF" 
          stroke-width="6" 
          stroke-linejoin="round"/>
    
    <!-- Effet de brillance sur le Y -->
    <path d="M 270 270 L 512 530 L 490 560 L 248 310 Z" 
          fill="url(#yShine)" 
          opacity="0.5"/>
    <path d="M 754 270 L 512 530 L 534 560 L 776 310 Z" 
          fill="url(#yShine)" 
          opacity="0.5"/>
    <path d="M 490 530 L 534 530 L 534 770 L 490 770 Z" 
          fill="url(#yShine)" 
          opacity="0.5"/>
  </g>
  
  <!-- Accent subtil en bas (symbole Ndop de l'araignée - sagesse) -->
  <g opacity="0.4">
    <circle cx="512" cy="920" r="10" fill="#FFD200"/>
    <line x1="512" y1="920" x2="485" y2="945" stroke="#FFD200" stroke-width="3"/>
    <line x1="512" y1="920" x2="539" y2="945" stroke="#FFD200" stroke-width="3"/>
    <line x1="512" y1="920" x2="485" y2="895" stroke="#FFD200" stroke-width="3"/>
    <line x1="512" y1="920" x2="539" y2="895" stroke="#FFD200" stroke-width="3"/>
  </g>
</svg>



