<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient violet simple et vibrant -->
    <linearGradient id="yGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9333EA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7E22CE;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Fond BLANC PUR - 100% opaque -->
  <rect width="1024" height="1024" fill="#FFFFFF" rx="200"/>
  
  <!-- La lettre Y en VIOLET - TRÈS ÉPAISSE pour visibilité maximale -->
  <!-- Branche gauche -->
  <path d="M 200 200 L 512 480 L 440 560 L 128 280 Z" 
        fill="url(#yGradient)" 
        stroke="#FFFFFF" 
        stroke-width="20" 
        stroke-linejoin="round"/>
  
  <!-- Branche droite -->
  <path d="M 824 200 L 512 480 L 584 560 L 896 280 Z" 
        fill="url(#yGradient)" 
        stroke="#FFFFFF" 
        stroke-width="20" 
        stroke-linejoin="round"/>
  
  <!-- Tige -->
  <rect x="440" y="480" width="144" height="340" 
        fill="url(#yGradient)" 
        stroke="#FFFFFF" 
        stroke-width="20" 
        rx="10"/>
</svg>

