<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E3A8A;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366F1;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="yGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F7971E;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFD200;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F7971E;stop-opacity:1" />
    </linearGradient>
    
    <filter id="yShadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dx="0" dy="10" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.4"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <linearGradient id="yShine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0" />
    </linearGradient>
  </defs>
  
  <rect width="1024" height="1024" fill="url(#bgGradient)" rx="180"/>
  
  <circle cx="512" cy="512" r="400" fill="#1E3A8A" opacity="0.15"/>
  
  <g filter="url(#yShadow)">
    <path d="M 260 260 L 512 520 L 480 560 L 228 300 Z" 
          fill="url(#yGradient)" 
          stroke="#FFFFFF" 
          stroke-width="6" 
          stroke-linejoin="round"/>
    
    <path d="M 764 260 L 512 520 L 544 560 L 796 300 Z" 
          fill="url(#yGradient)" 
          stroke="#FFFFFF" 
          stroke-width="6" 
          stroke-linejoin="round"/>
    
    <path d="M 480 520 L 544 520 L 544 800 L 480 800 Z" 
          fill="url(#yGradient)" 
          stroke="#FFFFFF" 
          stroke-width="6" 
          stroke-linejoin="round"/>
    
    <path d="M 270 270 L 512 530 L 490 560 L 248 310 Z" 
          fill="url(#yShine)" 
          opacity="0.5"/>
    <path d="M 754 270 L 512 530 L 534 560 L 776 310 Z" 
          fill="url(#yShine)" 
          opacity="0.5"/>
    <path d="M 490 530 L 534 530 L 534 770 L 490 770 Z" 
          fill="url(#yShine)" 
          opacity="0.5"/>
  </g>
  
  <g opacity="0.6">
    <circle cx="512" cy="920" r="8" fill="#FFD200"/>
    <path d="M 512 900 L 516 910 L 526 910 L 518 916 L 520 926 L 512 920 L 504 926 L 506 916 L 498 910 L 508 910 Z" 
          fill="#FFD200" 
          stroke="#FFFFFF" 
          stroke-width="2"/>
  </g>
</svg>



